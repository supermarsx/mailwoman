<!doctype html><html><head><meta charset="utf-8"><title>Independent identity relying party</title></head><body><h1>Independent identity relying party</h1><button id="start">Sign in with Mailwoman</button><button id="refresh" hidden>Refresh identity</button><button id="logout" hidden>Sign out</button><pre id="result" role="status"></pre><script>
const issuer='https://localhost:42215/oidc';const callback=location.origin+'/callback';let tokens;let metadata;const out=document.querySelector('#result');
const b64=bytes=>btoa(String.fromCharCode(...new Uint8Array(bytes))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');const bytes=raw=>Uint8Array.from(atob(raw.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));const digest=raw=>crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));const random=()=>b64(crypto.getRandomValues(new Uint8Array(32)));
async function configuration(){metadata=await(await fetch(issuer+'/.well-known/openid-configuration')).json();if(metadata.issuer!==issuer)throw Error('Issuer mismatch');}
async function verify(value){const [header,payload,signature]=value.id_token.split('.');const h=JSON.parse(new TextDecoder().decode(bytes(header)));const claims=JSON.parse(new TextDecoder().decode(bytes(payload)));if(h.alg!=='RS256')throw Error('Unexpected algorithm');const jwks=await(await fetch(metadata.jwks_uri)).json();const jwk=jwks.keys.find(k=>k.kid===h.kid);const key=await crypto.subtle.importKey('jwk',jwk,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['verify']);if(!await crypto.subtle.verify('RSASSA-PKCS1-v1_5',key,bytes(signature),new TextEncoder().encode(header+'.'+payload)))throw Error('Bad signature');const client=sessionStorage.getItem('client');if(claims.iss!==issuer||!claims.aud.includes(client)||claims.nonce!==sessionStorage.getItem('nonce')||claims.exp*1000<=Date.now())throw Error('Claims mismatch');const ah=new Uint8Array(await digest(value.access_token)).slice(0,16);if(claims.at_hash!==b64(ah))throw Error('Access hash mismatch');const info=await(await fetch(metadata.userinfo_endpoint,{headers:{authorization:'Bearer '+value.access_token}})).json();if(info.sub!==claims.sub)throw Error('UserInfo subject mismatch');out.textContent='Verified signature, issuer, audience, nonce and access-token hash.\nSubject: '+claims.sub;tokens=value;document.querySelector('#refresh').hidden=false;document.querySelector('#logout').hidden=false;document.querySelector('#start').hidden=true;}
document.querySelector('#start').onclick=async()=>{try{await configuration();const client=new URLSearchParams(location.search).get('client');sessionStorage.setItem('client',client);const verifier=random();sessionStorage.setItem('verifier',verifier);const state=random();sessionStorage.setItem('state',state);const nonce=random();sessionStorage.setItem('nonce',nonce);location.assign(metadata.authorization_endpoint+'?'+new URLSearchParams({client_id:client,redirect_uri:callback,response_type:'code',scope:'openid email offline_access',code_challenge:b64(await digest(verifier)),code_challenge_method:'S256',state,nonce}));}catch(e){out.textContent='ERROR '+e.message;}};
document.querySelector('#refresh').onclick=async()=>{try{const response=await fetch(metadata.token_endpoint,{method:'POST',body:new URLSearchParams({grant_type:'refresh_token',client_id:sessionStorage.getItem('client'),refresh_token:tokens.refresh_token})});if(!response.ok)throw Error('Refresh refused');await verify(await response.json());out.textContent+='\nRefresh verified';}catch(e){out.textContent='ERROR '+e.message;}};
document.querySelector('#logout').onclick=()=>location.assign(metadata.end_session_endpoint+'?'+new URLSearchParams({id_token_hint:tokens.id_token,post_logout_redirect_uri:location.origin+'/logged-out',state:'logout-proof'}));
(async()=>{try{if(location.pathname==='/logged-out'){if(new URLSearchParams(location.search).get('state')!=='logout-proof')throw Error('Logout state');out.textContent='Signed out of Mailwoman';return;}const query=new URLSearchParams(location.search);if(!query.has('code'))return;if(query.get('state')!==sessionStorage.getItem('state'))throw Error('State mismatch');sessionStorage.removeItem('state');await configuration();const response=await fetch(metadata.token_endpoint,{method:'POST',body:new URLSearchParams({grant_type:'authorization_code',client_id:sessionStorage.getItem('client'),code:query.get('code'),redirect_uri:callback,code_verifier:sessionStorage.getItem('verifier')})});if(!response.ok)throw Error('Code refused');await verify(await response.json());history.replaceState(null,'','/callback');}catch(e){out.textContent='ERROR '+e.message;}})();
</script></body></html>
