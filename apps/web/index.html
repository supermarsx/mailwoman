<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Mailwoman</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- The UI face is requested with the stylesheet, not when the first text renders (t52). -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/src/assets/fonts/jost/jost-latin-wght-normal.woff2" />
  </head>
  <body>
    <!-- Boot splash (t52, src/shell/bootSplash.ts): hidden unless src/boot/boot.js
         ran, shaped by what it stored on the last visit, faded out over the app. -->
    <div id="mw-boot" aria-hidden="true">
      <div class="mwb-progress"></div>
      <div class="mwb-shape">
        <div class="mwb-bar"><span class="mwb-block mwb-block--icon"></span><span class="mwb-block mwb-block--title"></span></div>
        <div class="mwb-side">
          <span class="mwb-block mwb-block--brand"></span>
          <span class="mwb-block mwb-block--compose"></span>
          <span class="mwb-block mwb-block--nav"></span><span class="mwb-block mwb-block--nav"></span><span class="mwb-block mwb-block--nav"></span>
          <span class="mwb-gap"></span>
          <span class="mwb-block mwb-block--nav"></span><span class="mwb-block mwb-block--nav"></span><span class="mwb-block mwb-block--nav"></span><span class="mwb-block mwb-block--nav"></span>
        </div>
        <div class="mwb-split"></div>
        <div class="mwb-main">
          <div class="mwb-tabs"><span class="mwb-block mwb-block--tab"></span></div>
          <div class="mwb-top"><span class="mwb-block mwb-block--tool"></span><span class="mwb-block mwb-block--tool"></span><span class="mwb-block mwb-block--tool"></span><span class="mwb-block mwb-block--tool"></span></div>
          <div class="mwb-list">
            <div class="mwb-lead"><span class="mwb-block mwb-block--search"></span></div>
            <div class="mwb-row"><span class="mwb-head"><span class="mwb-avatar"></span><span class="mwb-line"></span><span class="mwb-date"></span></span><span class="mwb-line"></span><span class="mwb-line mwb-line--dim"></span></div>
            <div class="mwb-row"><span class="mwb-head"><span class="mwb-avatar"></span><span class="mwb-line"></span><span class="mwb-date"></span></span><span class="mwb-line"></span><span class="mwb-line mwb-line--dim"></span></div>
            <div class="mwb-row"><span class="mwb-head"><span class="mwb-avatar"></span><span class="mwb-line"></span><span class="mwb-date"></span></span><span class="mwb-line"></span><span class="mwb-line mwb-line--dim"></span></div>
            <div class="mwb-row"><span class="mwb-head"><span class="mwb-avatar"></span><span class="mwb-line"></span><span class="mwb-date"></span></span><span class="mwb-line"></span><span class="mwb-line mwb-line--dim"></span></div>
            <div class="mwb-row"><span class="mwb-head"><span class="mwb-avatar"></span><span class="mwb-line"></span><span class="mwb-date"></span></span><span class="mwb-line"></span><span class="mwb-line mwb-line--dim"></span></div>
            <div class="mwb-row"><span class="mwb-head"><span class="mwb-avatar"></span><span class="mwb-line"></span><span class="mwb-date"></span></span><span class="mwb-line"></span><span class="mwb-line mwb-line--dim"></span></div>
            <div class="mwb-row"><span class="mwb-head"><span class="mwb-avatar"></span><span class="mwb-line"></span><span class="mwb-date"></span></span><span class="mwb-line"></span><span class="mwb-line mwb-line--dim"></span></div>
            <div class="mwb-row"><span class="mwb-head"><span class="mwb-avatar"></span><span class="mwb-line"></span><span class="mwb-date"></span></span><span class="mwb-line"></span><span class="mwb-line mwb-line--dim"></span></div>
            <div class="mwb-row"><span class="mwb-head"><span class="mwb-avatar"></span><span class="mwb-line"></span><span class="mwb-date"></span></span><span class="mwb-line"></span><span class="mwb-line mwb-line--dim"></span></div>
            <div class="mwb-row"><span class="mwb-head"><span class="mwb-avatar"></span><span class="mwb-line"></span><span class="mwb-date"></span></span><span class="mwb-line"></span><span class="mwb-line mwb-line--dim"></span></div>
            <div class="mwb-row"><span class="mwb-head"><span class="mwb-avatar"></span><span class="mwb-line"></span><span class="mwb-date"></span></span><span class="mwb-line"></span><span class="mwb-line mwb-line--dim"></span></div>
            <div class="mwb-row"><span class="mwb-head"><span class="mwb-avatar"></span><span class="mwb-line"></span><span class="mwb-date"></span></span><span class="mwb-line"></span><span class="mwb-line mwb-line--dim"></span></div>
            <div class="mwb-row"><span class="mwb-head"><span class="mwb-avatar"></span><span class="mwb-line"></span><span class="mwb-date"></span></span><span class="mwb-line"></span><span class="mwb-line mwb-line--dim"></span></div>
            <div class="mwb-row"><span class="mwb-head"><span class="mwb-avatar"></span><span class="mwb-line"></span><span class="mwb-date"></span></span><span class="mwb-line"></span><span class="mwb-line mwb-line--dim"></span></div>
          </div>
        </div>
      </div>
      <!-- The admin console (t72): its sign-in card and its frame. The same shapes
           as screens/Admin/shell/BootSkeleton.tsx. -->
      <div class="mwb-admin" inert>
        <div class="mwb-admin-card">
          <span class="mwb-admin-logo"><span class="mwb-block"></span></span>
          <span class="mwb-tx mwb-admin-title">&nbsp;<span class="mwb-block"></span></span>
          <span class="mwb-admin-note"><span class="mwb-tx">&nbsp;<span class="mwb-block"></span></span><span class="mwb-tx">&nbsp;<span class="mwb-block"></span></span><span class="mwb-tx">&nbsp;<span class="mwb-block"></span></span></span>
          <span class="field"><span class="mwb-tx">&nbsp;<span class="mwb-block"></span></span><input type="text" tabindex="-1" autocomplete="off" aria-hidden="true" /></span>
          <span class="field"><span class="mwb-tx">&nbsp;<span class="mwb-block"></span></span><input type="text" tabindex="-1" autocomplete="off" aria-hidden="true" /></span>
          <button type="button" class="btn" tabindex="-1">&nbsp;</button>
          <button type="button" class="btn" tabindex="-1">&nbsp;</button>
        </div>
      </div>
      <div class="mwb-console" inert>
        <div class="mwb-console-top"><span class="mwb-block"></span><span class="mwb-block mwb-block--title"></span><span class="mwb-block"></span></div>
        <div class="mwb-console-side">
          <span class="mwb-console-brand"><span class="mwb-mark"></span><span class="mwb-mark"></span><span class="mwb-mark"></span><span class="mwb-block"></span></span>
          <span class="mwb-console-nav">
            <span class="mwb-console-group"><span class="mwb-block mwb-console-group-label"></span><span class="mwb-console-item"><span class="mwb-block"></span></span><span class="mwb-console-item"><span class="mwb-block"></span></span><span class="mwb-console-item"><span class="mwb-block"></span></span><span class="mwb-console-item"><span class="mwb-block"></span></span></span>
            <span class="mwb-console-group"><span class="mwb-block mwb-console-group-label"></span><span class="mwb-console-item"><span class="mwb-block"></span></span><span class="mwb-console-item"><span class="mwb-block"></span></span><span class="mwb-console-item"><span class="mwb-block"></span></span><span class="mwb-console-item"><span class="mwb-block"></span></span><span class="mwb-console-item"><span class="mwb-block"></span></span></span>
          </span>
        </div>
        <div class="mwb-console-split"></div>
        <div class="mwb-console-main">
          <div class="mwb-console-head"><span class="mwb-block"></span><span class="mwb-block"></span></div>
          <div class="mwb-console-page">
            <div class="mwb-console-page-head"><span class="mwb-block"></span></div>
            <div class="mwb-console-panel"><span class="mwb-console-cards"><span></span><span></span><span></span></span><span class="mwb-line"></span><span class="mwb-line"></span><span class="mwb-line"></span></div>
          </div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
