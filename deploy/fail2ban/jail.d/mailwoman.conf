# fail2ban jail for Mailwoman. Install to /etc/fail2ban/jail.d/mailwoman.conf
# next to deploy/fail2ban/filter.d/mailwoman.conf. See docs/deploy/fail2ban.md.
#
# Mailwoman logs to stdout; under docs/deploy/mailwoman.service that is the
# systemd journal, so this jail reads the journal for mailwoman.service.
# If you run Mailwoman another way, see the "Log source" section of the doc.

[mailwoman]
enabled  = true
filter   = mailwoman
backend  = systemd
# Ban the ports clients reach Mailwoman on (the reverse proxy in front of it).
port     = http,https
# Same threshold as the server's in-process login monitor (5 in 15 minutes).
maxretry = 5
findtime = 15m
bantime  = 1h

# Sources Mailwoman blocked for probing for the admin console (t100). The server
# already counted the misses (grace allowance, then block), so one line bans.
# The firewall ban outlasts and widens the server's own block: it covers every
# port in `port` and every Mailwoman instance behind the same firewall.
[mailwoman-admin-probe]
enabled  = true
filter   = mailwoman-admin-probe
backend  = systemd
port     = http,https
maxretry = 1
findtime = 1h
bantime  = 6h
bantime.increment = true
