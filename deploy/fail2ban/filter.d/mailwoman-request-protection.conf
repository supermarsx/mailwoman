# fail2ban filter for sources Mailwoman's request protection blocked for
# requesting a recognized scan path (/.env, /.git/config, /wp-admin, ...).
# Install to /etc/fail2ban/filter.d/mailwoman-request-protection.conf.
# See docs/deploy/fail2ban.md.
#
# Mailwoman writes one line to stdout when a scan-path request starts an
# enforced block of its source:
#
#   <tracing prefix> <RFC 3339 time> mailwoman[request-protection]: source blocked; reason=probe-path blockSecs=<s> rhost=<ip>
#
# Browser requests made for another site (Sec-Fetch-Site cross-site or
# same-site) and requests carrying a verified session are not recorded, so they
# never produce a line.
#
# The failregex below must stay identical to
# request_protection::FAIL2BAN_PROBE_BLOCK_FAILREGEX
# (crates/mw-server/src/request_protection.rs); a unit test there fails if they differ.

[INCLUDES]
before = common.conf

[Definition]
failregex = mailwoman\[request-protection\]: source blocked; .*rhost=<HOST>
ignoreregex =

[Init]
# Used when the jail reads the systemd journal (backend = systemd).
journalmatch = _SYSTEMD_UNIT=mailwoman.service
