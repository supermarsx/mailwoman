# fail2ban filter for Mailwoman authentication failures.
# Install to /etc/fail2ban/filter.d/mailwoman.conf. See docs/deploy/fail2ban.md.
#
# Mailwoman writes one line per rejected credential (admin console and webmail
# sign-in) to stdout:
#
#   <tracing prefix> <RFC 3339 time> mailwoman[auth]: authentication failure; logname=<user> rhost=<ip>
#
# The failregex below must stay identical to mw_admin::FAIL2BAN_FAILREGEX
# (crates/mw-admin/src/banlist.rs); crates/mw-server/tests/t39_fail2ban_filter.rs
# fails if they differ.

[INCLUDES]
before = common.conf

[Definition]
failregex = mailwoman\[auth\]: authentication failure; .*rhost=<HOST>
ignoreregex =

[Init]
# Used when the jail reads the systemd journal (backend = systemd).
journalmatch = _SYSTEMD_UNIT=mailwoman.service
