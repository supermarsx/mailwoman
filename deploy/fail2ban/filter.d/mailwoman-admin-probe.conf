# fail2ban filter for sources Mailwoman blocked for probing for the admin console.
# Install to /etc/fail2ban/filter.d/mailwoman-admin-probe.conf. See docs/deploy/fail2ban.md.
#
# Mailwoman writes one line to stdout when its admin-probe protection blocks a
# source (security.adminProbe.fail2banLog, on by default):
#
#   <tracing prefix> <RFC 3339 time> mailwoman[admin-probe]: source blocked; signal=<kind> strike=<n> blockSecs=<s> rhost=<ip>
#
# The server has already applied its grace allowance and thresholds, so one
# line is enough for a ban (maxretry = 1 in the jail).
#
# The failregex below must stay identical to admin_probe::FAIL2BAN_PROBE_FAILREGEX
# (crates/mw-server/src/admin_probe.rs); a unit test there fails if they differ.

[INCLUDES]
before = common.conf

[Definition]
failregex = mailwoman\[admin-probe\]: source blocked; .*rhost=<HOST>
ignoreregex =

[Init]
# Used when the jail reads the systemd journal (backend = systemd).
journalmatch = _SYSTEMD_UNIT=mailwoman.service
