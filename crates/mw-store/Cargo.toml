[package]
name = "mw-store"
description = "Local store for Mailwoman: sessions + settings, encrypted at rest (sqlx/SQLite)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Explicit diagnostic fixture only; no trace hooks in default builds.
query-shape-diagnostics = []

[dependencies]
mw-platform-fs = { path = "../mw-platform-fs" }
async-stream = "0.3.6"
tokio = { workspace = true }
# V6 (t6-e1): enable the Postgres backend + pure-Rust rustls TLS ON TOP of the
# workspace SQLite defaults. `tls-rustls` resolves to `tls-rustls-ring-webpki`
# (ring + webpki-roots) — pure Rust, NO openssl / native-tls / aws-lc C code.
# SQLite stays the default backend (chosen by DSN in `Store::open`); these only
# add the Postgres code path. Features unify across the workspace but the default
# runtime backend is unchanged.
sqlx = { workspace = true, features = ["postgres", "tls-rustls"] }
chacha20poly1305 = { workspace = true }
rand = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Bounded O(1) LRU settings memos; already used by SQLx in this workspace.
hashlink = { workspace = true }
url = { workspace = true }
# 0012 upload store (t15): async storage-backend trait (`UploadBackend`) needs a
# dyn-compatible async trait, and the per-account on-disk subdirectory token is a
# SHA-256 of the account id. Both crates are already vendored workspace-wide, so this
# is net-zero new dependency-graph nodes (no C/-sys/openssl).
async-trait = { workspace = true }
sha2 = { workspace = true }
futures-util = { workspace = true }
# t48: linked-mailbox credentials are opened into `Zeroizing` buffers.
zeroize = { workspace = true }
# retention archive tier: sealed segments are gzip-compressed JSON lines.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

# Whole-database encryption (SQLCipher). The vendored libsqlite3-sys patch builds
# SQLCipher with a pure-Rust crypto provider (NO OpenSSL): see
# vendor/libsqlite3-sys-0.30.1/MAILWOMAN-PATCH.md. Plain SQLite files still open
# unchanged when no key is supplied.
libsqlite3-sys = { version = "0.30", features = ["bundled-sqlcipher"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }

[dev-dependencies]
tempfile = "3"
# The dual-backend parity + migrate-store integration tests open a raw Postgres
# pool (to TRUNCATE between runs and read ciphertext columns directly) when
# `DATABASE_URL_PG`/`MW_TEST_PG` is set; they run SQLite-only otherwise.
sqlx = { workspace = true, features = ["postgres", "tls-rustls"] }
# t25-e1: the shared skip/gate convention, so the three env-gated Postgres legs in
# `src/v2.rs`'s `#[cfg(test)]` module honour `MW_REQUIRE_LIVE` — a skip becomes a
# failure in the CI job that boots Postgres. It has to be a crate rather than the
# `#[path]` include `tests/backend_parity.rs` uses, because including a file from
# outside this crate into `src/` would break `cargo package`. Carries no `version`,
# so Cargo strips it from the published manifest; links nothing but `std`.
mw-test-gate = { workspace = true }
