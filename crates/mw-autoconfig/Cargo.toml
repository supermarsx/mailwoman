[package]
name = "mw-autoconfig"
description = "Mail server autoconfig discovery for Mailwoman (SRV/autoconfig/autodiscover)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# t22-e9: the HTTP rungs route through the workspace egress gate rather than
# holding their own client. NET-NEGATIVE on dependencies: reqwest leaves this crate,
# because a fully-delegating call site has no client left to configure.
mw-egress = { path = "../mw-egress" }
thiserror = { workspace = true }
async-trait = { workspace = true }
# Live RFC 6186 SRV resolution (pure-Rust DNS over UDP/TCP + rustls; no -sys/C/
# openssl). Default features = system-config + tokio. Already in-tree via
# mail-auth; coordinator reconciles Cargo.lock/deny.toml.
hickory-resolver = "0.26"

[dev-dependencies]
tokio = { workspace = true }
