# Reverse-proxy conformance (t20, tag 26.19).
#
# This workflow is what makes "mailwoman works behind nginx" a checkable claim
# instead of a shipped config file. It boots the real server behind one real
# proxy per matrix cell and drives it end to end through that proxy's published
# port.
#
# Shape:
#   1. `build-images` builds the two images from the repo Dockerfile ONCE
#      (`runtime` + `mock`), `docker save`s them into a single artifact.
#   2. `cell` fans out over the six TIER-1 proxies and envoy, each loading that artifact
#      rather than rebuilding, booting exactly one profile from
#      `docker-compose.proxy.yml`, and running the conformance suite against it.
#
# Ubuntu only, deliberately. Every cell is docker-compose-bound, so there is
# nothing for the Windows/macOS build matrix (`ci.yml`, t19) to add here.
#
# ---------------------------------------------------------------------------
# Coverage claims — read before writing any doc prose from this file
# ---------------------------------------------------------------------------
#
# CI-tested (tier 1): nginx, apache, caddy, haproxy-l7, haproxy-l4, traefik.
#
# Envoy (tier 2) is booted as a seventh cell since t30, NON-BLOCKING, for one
# reason: it is the only shipped config that appends to X-Forwarded-For, so it
# is the only cell in which `an_appending_proxy_still_resolves_the_real_client`
# can run. The cell runs the whole suite, but it is not part of the tier-1 gate:
# a red envoy cell does not fail this workflow. No runner has executed it yet;
# the suite passed against the envoy profile on a developer host (t30-e5).
# Its presence here does not make Envoy a supported proxy, and no prose anywhere
# may say "supports" Envoy on the strength of this workflow.
#
# NOT CI-tested: IIS. Its config is shipped under `docs/deploy/proxy/`, and that
# is all; it has no cell. IIS is "documented, not CI-tested" — the exact wording
# `docs/deploy/reverse-proxy.md` must use.
#
# HTTP/3 (t39-e12, L9). The application has no QUIC listener; HTTP/3 is
# terminated at the proxy (decision D2). The `h3` job boots the caddy, nginx
# and traefik cells and runs scripts/proxy-h3-check.sh, which negotiates HTTP/2
# over TCP (asserting `Alt-Svc: h3=`) and HTTP/3 over UDP with a quiche curl
# on the compose network, and for both protocols asserts that the app sees the
# client's Host (Origin check), scheme (Secure cookie + HSTS) and address
# (scoped-key allowlist, 200 vs a decoy's 403). It then requests HTTP/3 from
# the runner to the cell's published UDP port. The job is NON-BLOCKING and not
# part of the gate: no hosted runner has run it yet, and UDP forwarding on the
# runner is unverified. It passed for all three cells on a developer host
# (Docker 29.4.2 / Compose 5.1.3, t39-e12). PROMOTION: after green runs on
# master, set `continue-on-error: false` and add `h3` to the gate's `needs`.
#
# ---------------------------------------------------------------------------
# The suite this drives
# ---------------------------------------------------------------------------
#
# `crates/mw-server/tests/t20_proxy_conformance.rs` (t20-e11): thirteen tests,
# each driven through the cell's published port.
#
# The server in every cell runs with MW_CSRF_STRICT=true (docker-compose.proxy.yml,
# the setting deploy.sh writes). The suite repeats the mw_csrf cookie in
# X-CSRF-Token on its writes, and `a_write_without_the_csrf_token_is_refused`
# fails in a cell whose server does not refuse a write without it (26.20 t31-e6).
#
# Env contract handed to t20-e11 (all `MW_T20_*`; the suite LOUD-SKIPS a leg
# whose variable is absent, and never silently passes):
#
#   MW_T20_PROXY            "1" — master gate. Unset ⇒ whole suite skips, so the
#                           same binary is harmless in the normal `ci.yml` run.
#   MW_T20_PROXY_KIND       profile name verbatim: nginx | apache | caddy |
#                           haproxy-l7 | haproxy-l4 | traefik
#   MW_T20_PROXY_BASE       http://127.0.0.1:<http port>. Set but EMPTY for
#                           haproxy-l4, which is TLS-passthrough and has no HTTP
#                           listener — so the suite must treat an EMPTY value the
#                           same as an absent one and skip the plaintext legs.
#                           Same rule for every variable below.
#   MW_T20_PROXY_TLS_BASE   https://127.0.0.1:<https port>
#   MW_T20_PROXY_CA         absolute path to the self-signed leaf the cells use;
#                           pin it or skip verification, it is not a public CA
#   MW_T20_DIRECT_BASE      http://127.0.0.1:8607 — the SAME app process with no
#                           proxy in front and an UNTRUSTED peer. The control
#                           case: diff a through-proxy result against it.
#   MW_T20_EXPECT_CLIENT_IP 172.28.0.1 — the docker bridge gateway. Host traffic
#                           is NATed, so this (not the runner's LAN address) is
#                           the true client address observable inside the
#                           network. It is deliberately OUTSIDE
#                           MW_TRUSTED_PROXIES (172.28.10.0/24), which is what
#                           makes the trusted-hop walk a real test.
#   MW_T20_USER             mailbox login. The app signs in to its own
#   MW_T20_PASS             MW_UPSTREAM_DEFAULT (the compose `mock`, set in the
#                           x-app-env anchor of docker-compose.proxy.yml); a
#                           login cannot name a server (t32-h9). The mock is not
#                           published on the host.
#   MW_T20_PROXY_PREFIX     sub-path base. Left UNSET here on purpose: no
#                           sub-path proxy config is shipped under
#                           docs/deploy/proxy/. That test loud-skips.
#   MW_T20_XFF_APPENDS      "1" for a cell whose proxy appends to
#                           X-Forwarded-For. Set on NO cell: nginx
#                           (`$remote_addr`), apache (`RequestHeader unset` before
#                           mod_proxy adds one hop), caddy (`header_up ...
#                           {remote_host}`), haproxy-l7 (`del-header` then
#                           `set-header`) and traefik (no trustedIPs) each hand
#                           the app a single hop, and haproxy-l4 sets no header.
#                           The envoy cell appends; the suite recognises it by
#                           MW_T20_PROXY_KIND and needs no variable for it.
#
# ---------------------------------------------------------------------------
# What runs in no cell
# ---------------------------------------------------------------------------
#
# One of the thirteen tests skips in every cell, with a SKIPPED line:
#
#   sub_path_api_routes_return_json_not_the_spa_shell
#       needs a cell hosted under a path prefix. None is shipped.
#
# One runs in the envoy cell only, and skips in the six tier-1 cells:
#
#   an_appending_proxy_still_resolves_the_real_client
#       needs a proxy that appends to X-Forwarded-For. Outside that cell the
#       right-to-left walk it checks is covered in-process only, by
#       t20_forwarded_spoof.rs. The envoy cell is non-blocking, so a failure of
#       this test there does not fail the gate.
#
# The step "tests that did not run in this cell" copies every SKIPPED line to
# the run summary, so a green run still shows them.
#
# One behaviour has no test at all: the SSE stream of POST /api/assist/invoke
# through a proxy. No cell configures an Assist gateway, so the route answers
# 404 before streaming; the suite asserts that 404 and prints a note.
#
# ---------------------------------------------------------------------------
# Cost note
# ---------------------------------------------------------------------------
#
# Each cell compiles the test binary itself, sharing one `Swatinem/rust-cache`
# key across all legs (first run is seven cold compiles in parallel; every run
# after is warm). Building the binary once and shipping it as an artifact would
# be cheaper still and is the obvious upgrade if this ever gets slow.

name: proxy-conformance

on:
  workflow_dispatch: {}
  push:
    branches: ["master", "t20-**", "release/26.19**"]
    paths:
      - "Dockerfile"
      - "docker-compose.proxy.yml"
      - "docs/deploy/proxy/**"
      - "crates/mw-server/**"
      - "crates/mw-oauth/**"
      - "scripts/proxy-h3-check.sh"
      - ".github/workflows/proxy-conformance.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - "docker-compose.proxy.yml"
      - "docs/deploy/proxy/**"
      - "crates/mw-server/**"
      - "crates/mw-oauth/**"
      - "scripts/proxy-h3-check.sh"
      - ".github/workflows/proxy-conformance.yml"

permissions:
  contents: read

# Same rule as ci.yml: cancel superseded runs on a PR or topic branch, never on
# the default branch, where each SHA gets its own group so master's verdict for
# that commit survives the next push. This workflow's push filter includes
# `crates/mw-server/**`, which the lanes touch constantly, so it was exposed to
# exactly the same cancellation storm.
concurrency:
  group: proxy-conformance-${{ github.ref }}-${{ github.ref == 'refs/heads/master' && github.sha || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

env:
  CARGO_TERM_COLOR: always
  MW_PROXY_APP_IMAGE: mailwoman:proxy-test
  MW_PROXY_MOCK_IMAGE: mailwoman-mock:proxy-test

jobs:
  # ===========================================================================
  # Build the two images ONCE. Seven cells booting the same commit have no reason
  # to build it seven times, and a per-cell build would also let two cells run
  # against subtly different layers.
  #
  # `mock` reuses the `build` stage of `runtime`, so with the shared gha cache
  # the second image costs almost nothing.
  # ===========================================================================
  build-images:
    name: build images (once)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: mailwoman:proxy-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: build mock image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mock
          push: false
          load: true
          tags: mailwoman-mock:proxy-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # gzip -1: these are stripped release binaries in a distroless base, so the
      # marginal ratio past -1 is not worth the CPU. upload-artifact then stores
      # it uncompressed (compression-level 0) rather than re-zipping a gzip.
      - name: save images
        run: |
          set -eu
          docker save mailwoman:proxy-test mailwoman-mock:proxy-test \
            | gzip -1 > proxy-images.tar.gz
          ls -lh proxy-images.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: proxy-images
          path: proxy-images.tar.gz
          retention-days: 1
          compression-level: 0

  # ===========================================================================
  # One job per tier-1 proxy.
  # ===========================================================================
  cell:
    name: ${{ matrix.profile }}
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # `haproxy-l4`, the PROXY-protocol cell, carries nonblocking: true. It has
    # never booted on a runner: it failed at `up --wait` (see the boot step). The
    # boot sequence below passes locally with the runner's Compose version
    # (t30-e5), which is not a run on a runner.
    # PROMOTION: after one green haproxy-l4 cell on master, flip
    # `nonblocking: true` to `false` on its matrix entry below. That single line
    # is the whole change.
    continue-on-error: ${{ matrix.nonblocking }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: nginx
            http_port: 8601
            https_port: 8641
            nonblocking: false
            may_skip: an_appending_proxy_still_resolves_the_real_client sub_path_api_routes_return_json_not_the_spa_shell
          - profile: apache
            http_port: 8602
            https_port: 8642
            nonblocking: false
            may_skip: an_appending_proxy_still_resolves_the_real_client sub_path_api_routes_return_json_not_the_spa_shell
          - profile: caddy
            http_port: 8603
            https_port: 8643
            nonblocking: false
            may_skip: an_appending_proxy_still_resolves_the_real_client sub_path_api_routes_return_json_not_the_spa_shell
          - profile: haproxy-l7
            http_port: 8604
            https_port: 8644
            nonblocking: false
            may_skip: an_appending_proxy_still_resolves_the_real_client sub_path_api_routes_return_json_not_the_spa_shell
          # TLS passthrough: no HTTP listener at all, hence the empty http_port.
          # See the continue-on-error note above for why this one is nonblocking.
          - profile: haproxy-l4
            http_port: ""
            https_port: 8645
            nonblocking: true
            may_skip: an_appending_proxy_still_resolves_the_real_client sub_path_api_routes_return_json_not_the_spa_shell
          - profile: traefik
            http_port: 8605
            https_port: 8646
            nonblocking: false
            may_skip: an_appending_proxy_still_resolves_the_real_client sub_path_api_routes_return_json_not_the_spa_shell
          # Tier 2, not part of the gate. Here because it is the only shipped
          # config that appends to X-Forwarded-For, so the appending test runs
          # in this cell and in no other. See the header.
          - profile: envoy
            http_port: 8606
            https_port: 8647
            nonblocking: true
            may_skip: sub_path_api_routes_return_json_not_the_spa_shell

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for all legs — they compile identical artifacts.
          # Only one leg writes it, so the others do not race to save.
          shared-key: t20-proxy-conformance
          save-if: ${{ matrix.profile == 'nginx' }}

      # Compile BEFORE anything is booted. A compile error is then reported as a
      # compile error instead of burning the cell's container budget first, and
      # it is unambiguously distinguishable from a conformance failure.
      - name: build the conformance suite
        run: cargo test -p mw-server --test t20_proxy_conformance --no-run

      - uses: actions/download-artifact@v4
        with:
          name: proxy-images

      - name: load images
        run: |
          set -eu
          gzip -dc proxy-images.tar.gz | docker load
          # `docker image ls` takes at most one reference on current Docker CLIs.
          # `inspect` takes several and exits non-zero if either tag is missing.
          docker image inspect --format '{{.Id}} {{.RepoTags}}' \
            mailwoman:proxy-test mailwoman-mock:proxy-test

      # MUST run before `compose up`. The compose file mounts this directory
      # read-only into every HTTPS listener and into app-tls; if it is empty,
      # those containers fail to start and `--wait` reports a confusing red.
      - name: generate self-signed TLS material
        run: sh docs/deploy/proxy/tls/gen-certs.sh

      # THE RULE, because this is the only `--wait-timeout` in the repo and it is
      # the one shape that can turn a gate into a silent pass (t24-e16; re-measured
      # by t30-e5 with Compose 2.38.2, the version on the ubuntu-24.04 runner
      # image, which exits 0 here; Compose 5.1.3 exits 1 with "application not
      # healthy after ..."):
      #
      #   `up --wait` fails only once a container is `unhealthy`. While it is
      #   still `starting`, a failing probe does NOT fail the wait — so if
      #   `--wait-timeout` expires in that window, compose exits 0 and the job
      #   proceeds against a dead dependency.
      #
      # Therefore: a service's healthcheck must be able to REACH `unhealthy`
      # within the timeout, i.e. `start_period + retries x (interval + timeout)`
      # must stay BELOW the `--wait-timeout` here. Reproduced both ways: a
      # `retries: 40` healthcheck kept a container `starting` for ~200s and
      # `--wait --wait-timeout 45` exited 0 against a refusing probe; the same
      # stack with fast retries reached `unhealthy` and exited 1 in 13s.
      #
      # Worst case in this file today is `app` at 3 + 24 x (5 + 5) = 250s, inside
      # the 300s below — but the margin is only 50s. If you raise any `retries`
      # or `interval` in docker-compose.proxy.yml, raise this timeout with it, or
      # this gate starts reporting success on a cell that never came up.
      #
      # `app-tls` (haproxy-l4) is the one service with no probe. Its healthcheck
      # is `disable: true` because nothing inside that image can pass one (see the
      # service in docker-compose.proxy.yml). Compose 2.38.2 exits 1 from
      # `up --wait` with "container ... has no healthcheck configured" when such
      # a service is in the wait set: that is how this cell failed in run
      # 37440560835, and it reproduces locally with that binary. Compose 5.1.3
      # treats the service as running, so the cell booted on a dev machine.
      #
      # So the cell is started first, and the wait then names the services that
      # carry a probe and passes `--no-deps`, which keeps their dependencies
      # (app-tls among them) out of the wait set. `mock`, `app` and the service
      # named after the profile exist in every cell. app-tls's readiness is
      # covered by the `haproxy-l4` probe, which requests /healthz through the
      # balancer and reaches `unhealthy` in 203s when app-tls does not answer.
      - name: boot the ${{ matrix.profile }} cell
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -eu
          docker compose -f docker-compose.proxy.yml --profile "$PROFILE" up -d
          docker compose -f docker-compose.proxy.yml --profile "$PROFILE" up -d \
            --no-deps --wait --wait-timeout 300 mock app "$PROFILE"

      - name: conformance suite — ${{ matrix.profile }}
        id: suite
        env:
          MW_T20_PROXY: "1"
          MW_T20_PROXY_KIND: ${{ matrix.profile }}
          MW_T20_PROXY_BASE: ${{ matrix.http_port && format('http://127.0.0.1:{0}', matrix.http_port) || '' }}
          MW_T20_PROXY_TLS_BASE: https://127.0.0.1:${{ matrix.https_port }}
          MW_T20_PROXY_CA: ${{ github.workspace }}/docs/deploy/proxy/tls/certs/server.crt
          MW_T20_DIRECT_BASE: http://127.0.0.1:8607
          MW_T20_EXPECT_CLIENT_IP: 172.28.0.1
          MW_T20_USER: testuser@example.org
          MW_T20_PASS: testpass
          # A list, not `all`. Two tests skip by design in the tier-1 cells, one
          # of them in every cell (header, "What runs in no cell"). With `all`
          # both failed in every cell (run 37440560835: 9 passed, 3 failed, the
          # third being a note that called skip() and is now an eprintln!).
          #
          # A skip fails the test when its reason cites a variable named here,
          # and every name here must be set, or any skip fails. The names are
          # the variables this step sets for every cell, so "no cell booted",
          # no TLS base, no direct baseline, no expected client address and an
          # unusable CA are all still failures. The two by-design skips cite
          # MW_T20_XFF_APPENDS and MW_T20_PROXY_PREFIX, which are not here.
          #
          # MW_T20_PROXY is not listed although it is the master gate: the match
          # is by substring, and it would also match MW_T20_PROXY_PREFIX in the
          # sub-path skip. The "no cell booted" reason cites MW_T20_PROXY_KIND
          # so that it fails here; with the reason as it was before t30, a run
          # with MW_T20_PROXY unset reported 12 passed under this list.
          # (The `--no-run` step earlier only compiles the suite; it executes no
          # tests, so it has nothing to assert and is deliberately left alone.)
          MW_REQUIRE_LIVE: "MW_T20_PROXY_KIND,MW_T20_PROXY_TLS_BASE,MW_T20_PROXY_CA,MW_T20_DIRECT_BASE,MW_T20_EXPECT_CLIENT_IP"
          # One SKIPPED or UNMATCHED line per skip, read by the next step.
          MW_TEST_SKIP_LOG: ${{ runner.temp }}/t20-skips.log
          # MW_T20_PROXY_PREFIX and MW_T20_XFF_APPENDS intentionally unset — see
          # the header.
        run: |
          cargo test -p mw-server --test t20_proxy_conformance -- --nocapture --test-threads=1

      # The list above lets a skip pass when its reason cites no listed variable.
      # This step is what keeps that from hiding anything: it writes every skip
      # to the run summary, and it fails on a SKIPPED line for any test other
      # than the two named in ALLOWED and on any UNMATCHED line (a skip whose
      # reason names no gate variable at all).
      - name: tests that did not run in this cell
        if: ${{ always() && steps.suite.outcome != 'skipped' }}
        env:
          PROFILE: ${{ matrix.profile }}
          SKIP_LOG: ${{ runner.temp }}/t20-skips.log
          ALLOWED: ${{ matrix.may_skip }}
        run: |
          set -eu
          touch "$SKIP_LOG"
          {
            echo "### $PROFILE: tests that did not run"
            echo
            if [ -s "$SKIP_LOG" ]; then
              sed 's/^/- /' "$SKIP_LOG"
            else
              echo "None."
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          bad=0
          while IFS= read -r line; do
            tag=${line%% *}
            rest=${line#* }
            name=${rest%% *}
            case "$tag" in
              SKIPPED)
                case " $ALLOWED " in
                  *" $name "*) echo "skipped by design: $name" ;;
                  *) echo "::error::unexpected skip in the $PROFILE cell: $line"; bad=1 ;;
                esac ;;
              *) echo "::error::$PROFILE: $line"; bad=1 ;;
            esac
          done < "$SKIP_LOG"
          exit "$bad"

      # Always, and before teardown — a cell that failed to come up leaves its
      # only explanation in the container logs.
      - name: container state + logs
        if: always()
        run: |
          docker compose -f docker-compose.proxy.yml \
            --profile "${{ matrix.profile }}" ps -a || true
          docker compose -f docker-compose.proxy.yml \
            --profile "${{ matrix.profile }}" logs --no-color --timestamps --tail 400 || true

      # `-v`, not a bare `down`: the app volume holds a seeded SQLite DB, and
      # leaking it would let one cell start from another cell's state.
      - name: tear down
        if: always()
        run: |
          docker compose -f docker-compose.proxy.yml \
            --profile "${{ matrix.profile }}" down -v --remove-orphans

  # ===========================================================================
  # HTTP/3 through the proxy (t39-e12). Non-blocking; see the header. No cargo:
  # the check is curl against the booted cell.
  # ===========================================================================
  h3:
    name: h3 ${{ matrix.profile }}
    needs: build-images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: caddy
            https_port: 8643
          - profile: nginx
            https_port: 8641
          - profile: traefik
            https_port: 8646
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: proxy-images

      - name: load images
        run: |
          set -eu
          gzip -dc proxy-images.tar.gz | docker load

      - name: generate self-signed TLS material
        run: sh docs/deploy/proxy/tls/gen-certs.sh

      - name: boot the ${{ matrix.profile }} cell
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -eu
          docker compose -f docker-compose.proxy.yml --profile "$PROFILE" up -d
          docker compose -f docker-compose.proxy.yml --profile "$PROFILE" up -d \
            --no-deps --wait --wait-timeout 300 mock app "$PROFILE"

      - name: h2 + h3 through ${{ matrix.profile }}
        env:
          PROFILE: ${{ matrix.profile }}
          PORT: ${{ matrix.https_port }}
        run: bash scripts/proxy-h3-check.sh "$PROFILE" --published "$PORT"

      - name: container state + logs
        if: always()
        run: |
          docker compose -f docker-compose.proxy.yml \
            --profile "${{ matrix.profile }}" ps -a || true
          docker compose -f docker-compose.proxy.yml \
            --profile "${{ matrix.profile }}" logs --no-color --timestamps --tail 200 || true

      - name: tear down
        if: always()
        run: |
          docker compose -f docker-compose.proxy.yml \
            --profile "${{ matrix.profile }}" down -v --remove-orphans

  # ===========================================================================
  # Single check to require as a branch protection rule. Because the nonblocking
  # cell reports success via continue-on-error, this gate goes red exactly when a
  # BLOCKING cell fails.
  # ===========================================================================
  gate:
    name: tier-1 proxy gate
    needs: [build-images, cell]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: verdict
        run: |
          set -eu
          echo "build-images: ${{ needs.build-images.result }}"
          echo "cell:         ${{ needs.cell.result }}"
          if [ "${{ needs.build-images.result }}" != "success" ] \
            || [ "${{ needs.cell.result }}" != "success" ]; then
            echo "tier-1 proxy conformance FAILED" >&2
            exit 1
          fi
          echo "tier-1 proxy conformance passed (haproxy-l4 and envoy are non-blocking)"
