name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Nightly (03:17 UTC) drives the secret-gated `live-interop` job (real M365 /
  # Workspace tenants + real Ollama/OpenAI/Anthropic). It is NON-blocking for PR CI:
  # the job only runs on `schedule`/`workflow_dispatch`, never on push/pull_request.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# =============================================================================
# OS COVERAGE POLICY (t19-e4, tag 26.19)
#
# Three OSes carry a build/test gate:
#   Linux   — `rust`, `web` (blocking, unchanged) + every docker-compose job.
#   Windows — `rust-crossplatform`, `web-crossplatform`, `desktop-mobile-tests`,
#             `wasm-build`, `desktop-shell`, `desktop-e2e`.
#   macOS   — `rust-crossplatform`, `web-crossplatform`, `wasm-build`,
#             `desktop-shell` (+ `desktop-bundles` in packaging.yml).
#
# LINUX-ONLY BY DESIGN — do not fan these across the matrix. Every job below
# boots services from docker-compose.{dev,ci,crypto}.yml (Linux containers) or
# depends on a Linux-only toolchain, so a Windows/macOS leg could not run them
# at all; hosted macOS runners have no Docker daemon and hosted Windows runners
# only run Windows containers:
#   imap-conformance, managesieve-conformance, caldav-carddav-conformance,
#   e2e, e2e-engine, e2e-pim, e2e-crypto, e2e-v6, e2e-v7, zap-baseline,
#   store-dual-backend, migrate-store-smoke, cache-valkey,
#   directory-vs-openldap, assist-mock, android-apk, deny, js-licenses,
#   bundle-size, search-bench (a perf baseline is only comparable on one
#   runner class), crypto-interop, mail-auth-verdicts, bridge-fixtures,
#   wasm-plugin-build, jail, live-interop.
# The POSIX helper scripts those jobs invoke (wait-for-health.sh,
# search-bench.sh, radicale/seed.sh, managesieve/conformance.sh,
# greenmail/wait-for-greenmail.sh) are therefore never reached off Linux. The
# only scripts the non-Linux legs run are build-wasm.* and build-shells.*, both
# of which already ship .ps1 twins.
# =============================================================================
jobs:
  # -------------------------------------------------------------------------
  # workflow-lint — YAML-parse EVERY file in .github/workflows/.
  #
  # A workflow file that does not parse never runs, and GitHub reports it as a
  # workflow-file problem rather than a failing job — so it is silent. Two files
  # were in exactly that state and went unnoticed for two tags:
  # `t17-conformance.yml` (the whole 26.17 conformance suite, 7 test targets,
  # never executed) and `sso-e2e.yml:41` (an unquoted step name containing
  # ": " — a plain scalar may not contain a colon-space). Both are fixed; this
  # job is what stops the class from recurring silently.
  #
  # Deliberately a parse check, not a schema validator and not actionlint: it is
  # cheap, has no false positives, and covers the failure mode that actually bit
  # us. It also asserts each file is a mapping that HAS a `jobs:` block and a
  # trigger, because a file that parses but defines no jobs is silently inert in
  # the same way. Note the YAML 1.1 gotcha handled below: the bare key `on` loads
  # as the boolean True, not the string "on".
  #
  # Runs on every file, including workflows owned by other lanes. It is Linux-only
  # because it reads files and touches nothing platform-specific.
  # -------------------------------------------------------------------------
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: install parser
        run: pip install --quiet pyyaml
      - name: every .github/workflows/* parses and defines jobs
        run: |
          python3 - <<'PY'
          import glob, sys, yaml

          files = sorted(glob.glob(".github/workflows/*.yml") +
                         glob.glob(".github/workflows/*.yaml"))
          # A glob that silently matches nothing is the same class of bug this job
          # exists to catch, so treat it as a failure rather than a pass.
          if not files:
              sys.exit("no workflow files found under .github/workflows/ — "
                       "the glob matched nothing, which is itself the bug")

          errs = []
          for f in files:
              try:
                  doc = yaml.safe_load(open(f, encoding="utf-8"))
              except Exception as e:
                  errs.append(f"{f}: does not parse — {e}")
                  continue
              if not isinstance(doc, dict):
                  errs.append(f"{f}: top level is {type(doc).__name__}, expected a mapping")
                  continue
              if not doc.get("jobs"):
                  errs.append(f"{f}: no `jobs:` — the file would never run anything")
              # `on:` is YAML 1.1 boolean true; `"on"` only if it was quoted.
              if "on" not in doc and True not in doc:
                  errs.append(f"{f}: no trigger (`on:`) — the file would never run")
              print(f"  ok  {f}")

          if errs:
              print("\nFAIL:")
              for e in errs:
                  print("  -", e)
              sys.exit(1)
          print(f"\nAll {len(files)} workflow files parse and define jobs.")
          PY

  # -------------------------------------------------------------------------
  # Rust: format, lint, test, build. rust-embed compiles against the committed
  # apps/web/dist/.gitkeep placeholder, so no web build is needed here.
  # This is the LINUX leg; `rust-crossplatform` below runs the same gate on
  # Windows + macOS.
  # -------------------------------------------------------------------------
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The V5 Tauri shell crates (mailwoman-desktop / mailwoman-mobile) need the
      # Linux WebKitGTK system libraries to compile; they are built (Win + Linux)
      # in the dedicated `desktop-shell` job below (e8), NOT in this lean core job.
      # Nothing in the core workspace depends on them, so excluding them here is
      # clean. On Windows (WebView2 present) `cargo build --workspace` builds them
      # directly — see the e0 toolchain probe.
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --exclude mailwoman-desktop --exclude mailwoman-mobile --all-targets -- -D warnings
      # The canonical gate is THREE separate invocations, not one combined
      # `cargo test --workspace`:
      #   1. `cargo fmt --all --check`            (above)
      #   2. `--lib --tests -- --test-threads=1`  (below)
      #   3. `--doc`                              (below)
      # Combining 2 and 3 exits 1 on a doctest artifact even when every test
      # passes: `cargo test` activates dev-dependencies, which enable extra
      # features on shared crates, so the doctest phase can resolve a different
      # feature set, rebuild `mw_engine` mid-run and hand rustdoc a superseded
      # rlib path. Run standalone, `--doc` is green.
      #
      # `--test-threads=1` is separately required: several suites share a
      # `_sqlx_migrations` table and flake under the default in-binary
      # parallelism. t19-e2 is fixing that isolation at the source; once its
      # per-test unique temp DB has proven itself, that flag can be dropped.
      - name: test (lib + integration; --test-threads=1)
        run: cargo test --workspace --exclude mailwoman-desktop --exclude mailwoman-mobile --lib --tests -- --test-threads=1
      - name: doctests (separate invocation — see above)
        run: cargo test --workspace --exclude mailwoman-desktop --exclude mailwoman-mobile --doc
      - name: build
        run: cargo build --workspace --exclude mailwoman-desktop --exclude mailwoman-mobile

  # -------------------------------------------------------------------------
  # rust-crossplatform — the SAME core Rust gate as `rust` above, on macOS and
  # Windows. Together the two jobs are the mac/win/linux build+test matrix.
  #
  # NON-BLOCKING FOR NOW (`continue-on-error: true`). This repository has never
  # compiled on macOS in a gating context: the non-Linux arms of `mw-sandbox`
  # and `mw-render` are cfg-gated but were never compile-verified by CI, and the
  # reverse-proxy / PROXY-protocol listener code landing in this same tag is the
  # most platform-sensitive code in the tree. Promotion to required is a
  # deliberate second step once a run has actually gone green — a red required
  # check on mainline is a worse outcome than an advisory leg promoted later.
  #
  #   PROMOTION MARKER: delete the `continue-on-error: true` line below. That one
  #   line is the entire promotion; nothing else about this job changes.
  #
  # Deliberately a SEPARATE job rather than two more legs on `rust`'s matrix:
  # ~19 downstream jobs declare `needs: [rust]`, and `needs` waits for EVERY leg
  # of a matrix. Folding Windows/macOS into `rust` would put a full macOS
  # workspace build in front of every docker-compose job in the pipeline. With no
  # dependents this job runs fully in parallel, and promoting it to required
  # blocks the merge without serialising anything behind it.
  #
  # mailwoman-desktop / mailwoman-mobile stay excluded for parity with `rust`:
  # they have their own Windows lint+test home in `desktop-mobile-tests` and
  # their 3-OS build gate in `desktop-shell`.
  #
  # `cargo fmt --all --check` is NOT repeated here. rustfmt is host-independent,
  # and the Windows runner checks out with CRLF — a false-failure source for no
  # added signal. The Linux `rust` job stays the single fmt gate.
  # -------------------------------------------------------------------------
  rust-crossplatform:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace --exclude mailwoman-desktop --exclude mailwoman-mobile --all-targets -- -D warnings
      # Same three-invocation canonical gate as the `rust` job — see the comment
      # there for why `--doc` must not be folded into the `--lib --tests` run.
      # These legs run the gate they will have to pass once promoted to required.
      - name: test (lib + integration; --test-threads=1)
        run: cargo test --workspace --exclude mailwoman-desktop --exclude mailwoman-mobile --lib --tests -- --test-threads=1
      - name: doctests (separate invocation — see the `rust` job)
        run: cargo test --workspace --exclude mailwoman-desktop --exclude mailwoman-mobile --doc
      - name: build
        run: cargo build --workspace --exclude mailwoman-desktop --exclude mailwoman-mobile

  # -------------------------------------------------------------------------
  # desktop/mobile shell crates: clippy + unit tests. The lean `rust` job above
  # EXCLUDES mailwoman-desktop / mailwoman-mobile (their WebView backend needs
  # platform libs on Linux). This job is their real lint+test home: it runs on
  # windows-latest, where WebView2 is present so both crates build directly with
  # no extra system libraries. The host (rlib) unit tests — badge / keychain /
  # capture / selfcontained / notifications / deeplink / dragout / push — run
  # here; the full app launch is the separate `desktop-e2e` live gate below.
  # -------------------------------------------------------------------------
  desktop-mobile-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (desktop + mobile shells)
        run: cargo clippy -p mailwoman-desktop -p mailwoman-mobile --all-targets -- -D warnings
      - name: test (desktop + mobile shells)
        run: cargo test -p mailwoman-desktop -p mailwoman-mobile

  # -------------------------------------------------------------------------
  # Supply chain: licenses + advisories + bans + sources (deny.toml).
  # -------------------------------------------------------------------------
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories bans sources

  # -------------------------------------------------------------------------
  # IMAP conformance matrix: the env-gated live tests (#[ignore]) run against a
  # REAL mail server booted from docker-compose.dev.yml.
  #   - greenmail leg = the DETERMINISTIC gate (required; IMAP4rev1 + POP3 +
  #     SMTP). Runs mw-imap + mw-pop3 + mw-smtp + mw-server(engine_live).
  #   - dovecot leg = the production-FIDELITY target (continue-on-error until
  #     stabilised, plan §6 risk #11). No SMTP submission, so it runs
  #     mw-imap + mw-pop3 + mw-server only (the mw-smtp live test hard-requires
  #     GREENMAIL_SMTP).
  # Login is testuser/testpass on both; the IMAP login name is the local part.
  # -------------------------------------------------------------------------
  imap-conformance:
    runs-on: ubuntu-latest
    needs: [rust]
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: greenmail
            imap: "127.0.0.1:3143"
            pop3: "127.0.0.1:3110"
            smtp: "127.0.0.1:3025"
            crates: "-p mw-imap -p mw-pop3 -p mw-smtp -p mw-server"
            required: "true"
          - backend: dovecot
            imap: "127.0.0.1:2143"
            pop3: "127.0.0.1:2110"
            smtp: ""
            crates: "-p mw-imap -p mw-pop3 -p mw-server"
            required: "false"
    # Dovecot is the fidelity leg — informational, never fails the pipeline.
    continue-on-error: ${{ matrix.required == 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: boot ${{ matrix.backend }} (wait for healthy)
        run: docker compose -f docker-compose.dev.yml up -d --wait ${{ matrix.backend }}
      - name: assert IMAP login works (greenmail gate)
        if: matrix.backend == 'greenmail'
        env:
          GREENMAIL_USER: testuser
          GREENMAIL_PASS: testpass
        run: ./scripts/greenmail/wait-for-greenmail.sh 127.0.0.1 3143 60
      - name: live conformance tests (${{ matrix.backend }})
        env:
          GREENMAIL_IMAP: ${{ matrix.imap }}
          GREENMAIL_POP3: ${{ matrix.pop3 }}
          GREENMAIL_USER: testuser
          GREENMAIL_PASS: testpass
          GREENMAIL_TLS: plaintext
        run: |
          if [ -n "${{ matrix.smtp }}" ]; then
            export GREENMAIL_SMTP="${{ matrix.smtp }}"
          fi
          cargo test ${{ matrix.crates }} --test '*' -- --ignored
      - name: server logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color ${{ matrix.backend }}
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  # -------------------------------------------------------------------------
  # Web: typecheck, lint, unit tests, build. The bundle-size gate is a dedicated
  # job (`bundle-size`) so it is a first-class, named §23 gate.
  # -------------------------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install
        run: pnpm -C apps/web install --frozen-lockfile
      - name: typecheck
        run: pnpm -C apps/web typecheck
      - name: lint
        run: pnpm -C apps/web lint
      - name: test
        run: pnpm -C apps/web test
      - name: build
        run: pnpm -C apps/web build

  # -------------------------------------------------------------------------
  # web-crossplatform — the same typecheck / test / build as `web` above, on
  # macOS and Windows. Node itself is portable, but the things that break off
  # Linux are real and cheap to catch: path-separator assumptions in vite config
  # and test fixtures, case-insensitive filesystem import mismatches (macOS +
  # Windows), and CRLF-sensitive snapshot assertions.
  #
  # NON-BLOCKING FOR NOW, same posture and same reason as `rust-crossplatform`.
  #
  #   PROMOTION MARKER: delete the `continue-on-error: true` line below.
  #
  # Separate job (not extra legs on `web`) because `e2e`, `e2e-engine`,
  # `e2e-pim`, `e2e-crypto`, `e2e-v6` and `e2e-v7` all declare `needs: [rust,
  # web]` — see the `rust-crossplatform` rationale.
  #
  # `pnpm lint` is not repeated here: ESLint is host-independent, so the `web`
  # job stays the single lint gate.
  # -------------------------------------------------------------------------
  web-crossplatform:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install
        run: pnpm -C apps/web install --frozen-lockfile
      - name: typecheck
        run: pnpm -C apps/web typecheck
      - name: test
        run: pnpm -C apps/web test
      - name: build
        run: pnpm -C apps/web build

  # -------------------------------------------------------------------------
  # JS licenses: allowlist over runtime deps. Non-blocking for now (the
  # authoritative supply-chain gate is cargo-deny); tighten once verified.
  # -------------------------------------------------------------------------
  js-licenses:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install
        run: pnpm -C apps/web install --frozen-lockfile
      - name: check licenses (runtime deps)
        run: >-
          pnpm -C apps/web dlx license-checker-rseidelsohn
          --production --summary
          --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Zlib;MPL-2.0;CC0-1.0;Unlicense;Python-2.0"

  # -------------------------------------------------------------------------
  # E2E: build the compose stack (mock backend), wait healthy, run Playwright.
  # The Playwright config + specs are authored by e8 at apps/web/e2e and
  # apps/web/playwright.config.ts, plus @playwright/test in devDependencies.
  # -------------------------------------------------------------------------
  e2e:
    runs-on: ubuntu-latest
    needs: [rust, web]
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install web deps (includes Playwright once e8 lands)
        run: pnpm -C apps/web install --frozen-lockfile
      - name: cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
      - name: install Playwright chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium
      - name: build + start stack (mock backend)
        run: docker compose -f docker-compose.dev.yml up -d --build mock mailwoman
      - name: wait for server health
        run: ./scripts/wait-for-health.sh http://localhost:8080/healthz 240
      - name: run Playwright E2E (mock / proxy mode)
        run: pnpm -C apps/web exec playwright test --project=mock
      - name: compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color
      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  # -------------------------------------------------------------------------
  # V2 perf/security/conformance gates (plan §3 e11).
  # -------------------------------------------------------------------------

  # Search p95 < 50 ms over 100k (SPEC §23). The gate lives in the Rust test
  # `crates/mw-search/tests/bench.rs`, which asserts p95 < 50 ms; the wrapper
  # runs it in release and surfaces the measured p95 for the log/trend.
  search-bench:
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: mw-search p95 gate (<50 ms over 100k)
        run: bash ./scripts/search-bench.sh

  # Bundle-size gate (SPEC §23): the login->inbox entry chunk must be < 250 KB
  # gzip and pdfjs must stay OFF the critical path (a lazy chunk). Both asserted
  # by apps/web/scripts/check-size.mjs (`pnpm run size`).
  bundle-size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install
        run: pnpm -C apps/web install --frozen-lockfile
      - name: build
        run: pnpm -C apps/web build
      - name: bundle-size gate (entry < 250 KB gzip; pdfjs lazy)
        run: pnpm -C apps/web run size

  # OWASP ZAP baseline scan against the running mock stack — the SPEC §27 V2 exit
  # gate. Flaky/slow, so continue-on-error; the HTML report is uploaded.
  zap-baseline:
    runs-on: ubuntu-latest
    needs: [rust, web]
    continue-on-error: true
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - name: build + start stack (mock backend)
        run: docker compose -f docker-compose.dev.yml up -d --build mock mailwoman
      - name: wait for server health
        run: ./scripts/wait-for-health.sh http://localhost:8080/healthz 240
      - name: ZAP baseline scan
        # -I: warnings do not fail the scan (only FAIL-level rules do); -m 5:
        # cap the spider. The report is written to the mounted workspace.
        run: |
          docker run --network host -v "$PWD:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -I -m 5 \
            -r zap-baseline-report.html
      - name: upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-baseline-report.html
          if-no-files-found: ignore
          retention-days: 7
      - name: compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  # ManageSieve (RFC 5804) conformance vs Dovecot-Pigeonhole — the LIVE path for
  # mw-sieve's ManageSieve CLIENT (plan §6 risk #9). Greenmail has no
  # ManageSieve, so it stays the always-green gate and engine-side rule
  # execution is the always-green path -> this leg is continue-on-error.
  managesieve-conformance:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: boot dovecot-pigeonhole (wait healthy)
        run: docker compose -f docker-compose.dev.yml up -d --wait dovecot-pigeonhole
      - name: ManageSieve conformance (PUTSCRIPT compiles generated Sieve)
        run: bash ./scripts/managesieve/conformance.sh 127.0.0.1 4190 60
      - name: server logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color dovecot-pigeonhole
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  # -------------------------------------------------------------------------
  # V3 (PIM) CalDAV/CardDAV conformance vs Radicale (plan §3 e11). The env-gated
  # live tests (#[ignore]) in mw-dav / mw-carddav / mw-engine run against a REAL
  # CalDAV/CardDAV server booted from docker-compose.dev.yml:
  #   - mw-dav        — RFC 6764 discovery -> sync-collection (create/sync).
  #   - mw-carddav    — addressbook discovery -> query -> multiget projection.
  #   - mw-engine     — a full sync_pim round-trip: engine A PUTs an event to the
  #                     real collection, engine B (fresh store) pulls it back.
  # Radicale is the DETERMINISTIC green gate (required). Google/M365 quirk
  # fixtures are RECORDED XML exercised by the always-green `rust` job (not here),
  # so this job needs no live OAuth and stays deterministic. Radicale is CI infra
  # (a separate networked GPLv3 program, never linked/shipped — plan §1.5,
  # deny.toml), excluded from the dependency-license scope.
  # -------------------------------------------------------------------------
  caldav-carddav-conformance:
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: boot radicale (wait healthy)
        run: docker compose -f docker-compose.dev.yml up -d --wait radicale
      - name: seed radicale collections (VEVENT + VTODO calendars + addressbook)
        run: sh ./scripts/radicale/seed.sh 127.0.0.1 5232 60
      - name: CalDAV/CardDAV live conformance (discovery / sync / round-trip / 412 conflict)
        env:
          RADICALE_URL: "http://127.0.0.1:5232"
          RADICALE_USER: testuser
          RADICALE_PASS: testpass
        run: cargo test -p mw-dav -p mw-carddav -p mw-engine -- --ignored
      - name: server logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color radicale
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  # -------------------------------------------------------------------------
  # E2E (engine mode): the SAME web UI, but mw-server in MW_MODE=engine driving
  # a REAL IMAP/SMTP account (Greenmail) through mw-engine — the V1 exit gate
  # "engine mode drives a real IMAP account through the unmodified web UI".
  # Boots greenmail + mailwoman-engine (:8090) and runs the `engine` Playwright
  # project (imap-engine.spec.ts): login -> real IMAP mailbox -> compose+send
  # via SMTP -> the message arrives, is MIME-parsed, and renders in the
  # sandboxed reader. Sibling of the mock `e2e` job; both must stay green.
  # -------------------------------------------------------------------------
  e2e-engine:
    runs-on: ubuntu-latest
    needs: [rust, web]
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install web deps
        run: pnpm -C apps/web install --frozen-lockfile
      - name: cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
      - name: install Playwright chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium
      - name: build + start engine stack (greenmail + mw-server engine mode)
        run: docker compose -f docker-compose.dev.yml up -d --build --wait greenmail mailwoman-engine
      - name: wait for server health
        run: ./scripts/wait-for-health.sh http://localhost:8090/healthz 240
      - name: run Playwright E2E (engine mode vs Greenmail)
        run: pnpm -C apps/web exec playwright test --project=engine
      - name: compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color greenmail mailwoman-engine
      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-engine
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  # -------------------------------------------------------------------------
  # E2E (V3 PIM): the SAME engine-mode server (:8090) as `e2e-engine`, but the
  # `pim` Playwright project drives the four PIM modules (calendar / tasks /
  # notes / contacts) through the real UI — the plan §3 e12 / DoD live-E2E gate
  # "each module reachable from the nav + engine-backed, not just unit-green".
  # The modules run over the engine's auto-seeded Mailwoman-native collections
  # (a default calendar/task-list/notebook/address-book is seeded on first get),
  # so no CalDAV account is needed in the browser — the CalDAV/CardDAV round-trip
  # itself is the separate `caldav-carddav-conformance` (Rust) gate. Sibling of
  # the `e2e` / `e2e-engine` jobs; all three must stay green.
  # -------------------------------------------------------------------------
  e2e-pim:
    runs-on: ubuntu-latest
    needs: [rust, web]
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install web deps
        run: pnpm -C apps/web install --frozen-lockfile
      - name: cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
      - name: install Playwright chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium
      - name: build + start engine stack (greenmail + mw-server engine mode)
        run: docker compose -f docker-compose.dev.yml up -d --build --wait greenmail mailwoman-engine
      - name: wait for server health
        run: ./scripts/wait-for-health.sh http://localhost:8090/healthz 240
      - name: run Playwright E2E (PIM modules vs engine)
        run: pnpm -C apps/web exec playwright test --project=pim
      - name: compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs --no-color greenmail mailwoman-engine
      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pim
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  # ===========================================================================
  # V4 (Crypto & Security) CI jobs — plan §3 e9. Filled by e9 from the e0 stubs
  # once the wasm bundle + crypto/verdict fixtures landed (e1/e6/e8/e8b). Each is a
  # focused, named §27-V4 gate. The interop + verdict tests also run inside the
  # always-green `rust` job's `cargo test --workspace`; these surface them as
  # first-class signals, and `wasm-build` is the ONLY place the 2-OS wasm toolchain
  # is exercised end-to-end (the top V4 risk, §6#2).
  # ===========================================================================

  # wasm-build — the TOP V4 risk (§6#2 / §1.13): build mw-crypto AND mw-sanitize to
  # wasm32 via wasm-pack on Linux, Windows AND macOS (scripts/build-wasm.{sh,ps1},
  # which build both crates), then run a Node smoke that drives the freshly-built
  # bundle through generateKey → encrypt → decrypt and asserts the plaintext
  # round-trips. rPGP/RustCrypto are pure-Rust + wasm-tested; getrandom uses its JS
  # backend on wasm32 (selected by the build scripts). The smoke imports the
  # wasm-pack `--target web` glue directly (initSync + the frozen §2.3 exports) — no
  # pnpm/web build needed, so it stays a pure toolchain-portability gate.
  #
  # t19-e4 (26.19): the macOS leg is NEW and non-blocking — the wasm toolchain has
  # never been exercised on macOS here. Linux + Windows keep their existing
  # required posture, so this adds signal without adding risk.
  #   PROMOTION MARKER: replace the `continue-on-error:` expression below with
  #   `continue-on-error: false`, or delete the line outright.
  wasm-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install wasm-pack
        run: cargo install wasm-pack --locked
      - name: build wasm bundles (mw-crypto + mw-sanitize)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then pwsh scripts/build-wasm.ps1; else bash scripts/build-wasm.sh; fi
      - name: node wasm smoke (generateKey -> encrypt -> decrypt round-trip)
        shell: bash
        run: |
          node --input-type=module -e "import {readFileSync} from 'node:fs'; import {resolve} from 'node:path'; import {pathToFileURL} from 'node:url'; const dir=resolve(process.cwd(),'apps/web/src/wasm/mw-crypto'); const m=await import(pathToFileURL(resolve(dir,'mw_crypto.js')).href); m.initSync({module:readFileSync(resolve(dir,'mw_crypto_bg.wasm'))}); const P='mailwoman wasm smoke round-trip'; const k=m.generateKey({kind:'pgp',userId:'Smoke <smoke@example.com>',passphrase:'pw'}); const c=m.encrypt({kind:'pgp',plaintext:P,recipientPublicKeys:[k.publicKeyArmored]}); const o=m.decrypt({kind:'pgp',ciphertext:c.armoredCiphertext,encryptedPrivateBundle:k.encryptedPrivateBundle,passphrase:'pw'}); if(o.plaintextText!==P) throw new Error('wasm smoke round-trip mismatch: '+JSON.stringify(o.plaintextText)); console.log('ROUNDTRIP_OK');"

  # crypto-interop — decrypt/verify GnuPG- and openssl(Outlook-style)-GENERATED
  # recorded fixtures (fixtures/crypto/**, no live keyserver/DNS — §6#6 / §25). The
  # tests run in the default `native` feature: pgp.rs covers the GnuPG interop
  # vector (decrypt + verify a real `gpg`-produced message); smime.rs the openssl
  # CMS sign/verify + RSA+AES enveloped decrypt + PKCS#12 import.
  crypto-interop:
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: PGP/S-MIME interop fixtures (recorded GnuPG/Thunderbird/Outlook)
        run: cargo test -p mw-crypto --test pgp --test smime

  # mail-auth-verdicts — DKIM verdicts against a seeded OFFLINE resolver (e6's
  # SeededTxtCache, RFC 8463 ed25519 vector — deterministic PASS and FAIL, never
  # touches the network, §6#7). The same lib-test path also proves the
  # Received-chain parse, attachment ext-vs-magic risk, and anomaly detection.
  mail-auth-verdicts:
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: DKIM/verdict tests (seeded-DNS, pass AND fail)
        run: cargo test -p mw-engine --lib security::verdict

  # -------------------------------------------------------------------------
  # E2E (V4 crypto): the SAME engine-mode server (:8090) as e2e-engine/e2e-pim,
  # but the `crypto` Playwright project drives the V4 crypto/security UIs (key
  # management, Security panel, Compose encrypt + DLP, max-security switch)
  # through the real UI against the real engine + the real WASM crypto worker —
  # the plan §3 e10 / DoD live-E2E gate. The mailwoman-engine image builds the web
  # from source, so the committed apps/web/src/wasm bundles ship in the served app
  # (the worker + wasm stay lazy, off the login->inbox path). e10 authors
  # apps/web/e2e/crypto-*.spec.ts + the `crypto` project in playwright.config.ts
  # (testMatch crypto-*.spec.ts, baseURL the engine :8090); this job WIRES the
  # invocation. Sibling of e2e / e2e-engine / e2e-pim — all four must stay green.
  # -------------------------------------------------------------------------
  e2e-crypto:
    runs-on: ubuntu-latest
    needs: [rust, web]
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install web deps
        run: pnpm -C apps/web install --frozen-lockfile
      - name: cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
      - name: install Playwright chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium
      - name: build + start engine stack (greenmail + mw-server engine mode, incl. wasm + DLP rule)
        run: docker compose -f docker-compose.dev.yml -f docker-compose.crypto.yml up -d --build --wait greenmail mailwoman-engine
      - name: wait for server health
        run: ./scripts/wait-for-health.sh http://localhost:8090/healthz 240
      - name: run Playwright E2E (V4 crypto/security vs engine + WASM worker)
        run: pnpm -C apps/web exec playwright test --project=crypto
      - name: compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.dev.yml -f docker-compose.crypto.yml logs --no-color greenmail mailwoman-engine
      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-crypto
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.dev.yml -f docker-compose.crypto.yml down -v

  # ===========================================================================
  # V5 (26.6.0) thin-shell CI — plan §3 e8. Build the Tauri v2 desktop shell
  # (Windows + Linux, macOS best-effort) with the §16 bundle-size gate, and the
  # Android APK (the mobile command-name + Kotlin-plugin verification). The live
  # tauri-driver desktop E2E stays scaffolded below for e9 (it owns apps/desktop/e2e).
  # ===========================================================================

  # desktop-shell — the DoD live-build gate (plan §7): `tauri build` produces a
  # launching desktop app on Windows (the hard gate) + Linux (the required CI peer),
  # with macOS best-effort. Runs scripts/build-shells.{sh,ps1}, which builds the
  # shared SPA once, emits the §7.4 bundle-hash, bundles the sibling `mw-server` for
  # self-contained mode, `tauri build --no-bundle`s the shell, and asserts the §16
  # size budgets (thin < 10 MB, self-contained < 40 MB via scripts/check-bundle-size.mjs).
  desktop-shell:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Windows + Linux are required; macOS is best-effort (Windows is the hard live
    # gate, plan §1.9/§7) so a macOS-only failure never reds the pipeline.
    #   PROMOTION MARKER (t19-e4, 26.19): once the macOS leg has actually gone
    #   green, replace the expression with `continue-on-error: false` or delete
    #   the line. Bundling/notarization stays best-effort regardless — no signing
    #   certificates exist, and this job builds with `--no-bundle`.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      # Linux: Tauri's WebKitGTK webview backend needs these system libs (Windows
      # ships WebView2; macOS ships WKWebView). patchelf is needed by the Tauri build.
      - name: install Linux webview deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf
      - name: build thin + self-contained desktop shell + §16 size gate
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then pwsh scripts/build-shells.ps1; else bash scripts/build-shells.sh; fi
      - name: upload desktop binary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailwoman-desktop-${{ matrix.os }}
          path: |
            target/release/mailwoman-desktop
            target/release/mailwoman-desktop.exe
          if-no-files-found: ignore
          retention-days: 7

  # android-apk — the mobile-shell CI gate (plan §1.11 / risk #1). This dev machine
  # has no JDK, so `tauri android init/build` + the custom-Kotlin merge cannot be
  # verified locally; they are provisioned only here. The Rust cdylib cross-compile
  # to the Android targets exercises the #[cfg(mobile)] capability bindings and the
  # app-level `mw_*` command registration (t7-e8 reconciliation); android-src/merge.py
  # then merges the tracked Kotlin plugins (UnifiedPush / FLAG_SECURE /
  # EncryptedSharedPreferences keychain) + manifest + Gradle deps into the generated
  # gen/ project before the APK build. continue-on-error keeps this HONEST: a
  # toolchain-provisioning or merge failure is a tracked gap (docs/deploy/mobile-android.md),
  # not a pipeline-red, exactly as planned for the Android/iOS deferrals.
  android-apk:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: install Android NDK
        run: sdkmanager "ndk;27.0.12077973"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: build shared SPA + emit UI-bundle hash (§7.4)
        run: |
          pnpm -C apps/web install --frozen-lockfile
          pnpm -C apps/web build
          node scripts/emit-bundle-hash.mjs
      - name: tauri android init (generate gen/android)
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          pnpm -C apps/mobile install
          pnpm -C apps/mobile exec tauri android init --ci
      - name: merge tracked Kotlin plugins + manifest + Gradle deps
        run: python3 apps/mobile/src-tauri/android-src/merge.py
      - name: tauri android build (APK)
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
        run: pnpm -C apps/mobile exec tauri android build --apk
      - name: upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mailwoman-android
          path: apps/mobile/src-tauri/gen/android/app/build/outputs/**/*.apk
          if-no-files-found: ignore
          retention-days: 7

  # desktop-e2e (e9) — the LIVE tauri-driver / WebdriverIO desktop E2E on Windows.
  # It builds the PRODUCTION shell (embedded, §7.4-hash-verified SPA + the staged
  # self-contained mw-server) via scripts/build-shells.ps1, installs tauri-driver
  # plus a msedgedriver matched to the runner's WebView2 runtime, and drives the
  # REAL app through apps/desktop/e2e/specs/desktop.e2e.mjs: boot past the integrity
  # gate → keychain (DPAPI) → capture protection → notification → badge → the
  # self-contained mw-server spawn.
  #
  # continue-on-error is HONEST, not a silent omission: the job genuinely runs (the
  # harness is verified live on a Windows dev machine — apps/desktop/e2e/README.md).
  # Its one non-deterministic dependency is the WebView2-runtime ↔ msedgedriver
  # version match on the HOSTED runner — Evergreen WebView2 on windows-latest updates
  # independently, and if Microsoft has not yet published the exactly-matching driver
  # the session cannot attach. So it is informational (same posture as the dovecot
  # fidelity + android-apk legs) rather than reddening PR CI on a driver-pin drift.
  desktop-e2e:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: install tauri-driver
        run: cargo install tauri-driver --locked
      - name: build production desktop shell (embedded SPA + staged mw-server)
        run: pwsh scripts/build-shells.ps1
      - name: resolve a WebView2-matched msedgedriver
        shell: pwsh
        run: |
          $guid = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'   # Evergreen WebView2 runtime
          $keys = @(
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$guid",
            "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$guid",
            "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$guid"
          )
          $ver = $null
          foreach ($k in $keys) {
            try { $ver = (Get-ItemProperty -Path $k -Name pv -ErrorAction Stop).pv } catch {}
            if ($ver) { break }
          }
          if (-not $ver) { throw 'WebView2 Evergreen runtime not found on this runner' }
          Write-Host "WebView2 runtime version: $ver"
          $url = "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\edgedriver.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\edgedriver.zip" -DestinationPath "$env:RUNNER_TEMP\edgedriver" -Force
          "MSEDGEDRIVER=$env:RUNNER_TEMP\edgedriver\msedgedriver.exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: install desktop E2E harness deps
        run: pnpm -C apps/desktop/e2e install
      # wdio.conf.mjs auto-resolves target/release/mailwoman-desktop.exe (repo-root
      # relative) and reads MSEDGEDRIVER from the env set above.
      - name: run desktop live E2E (tauri-driver + WebdriverIO)
        run: pnpm -C apps/desktop/e2e test

  # ===========================================================================
  # V6 (26.7.0) CI jobs — plan §3 e12/e13. SCAFFOLDED (commented) by e0; each is
  # activated by its owning executor once the implementation + docker-compose.ci.yml
  # services land. All boot NETWORK-ONLY services (postgres:16 / valkey:8) from
  # docker-compose.ci.yml — mere aggregation, out of cargo-deny scope by design.
  # ===========================================================================

  # store-dual-backend (e1 + e12) — the mock-vs-real backend parity gate: run the
  # mw-store / mw-engine / mw-server suites against BOTH SQLite (in-memory, the
  # default, always) AND a live postgres:16. The table-driven backend-parity test
  # (crates/mw-store/tests/backend_parity.rs) runs each repo method on both backends
  # and asserts identical results; it activates its Postgres leg only when
  # DATABASE_URL_PG is set (this job sets it), otherwise it SKIPs with a clear log
  # (never a silent pass). SQLite-path assertions run regardless (plan §3 e1/§11).
  store-dual-backend:
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: boot postgres:16 (wait healthy)
        run: docker compose -f docker-compose.ci.yml up -d --wait postgres
      - name: store/engine/server suites on BOTH backends (SQLite + live Postgres)
        env:
          # The store tests read the PG DSN from DATABASE_URL_PG (or MW_TEST_PG);
          # crates that don't consume it run their default SQLite path unchanged.
          DATABASE_URL_PG: "postgres://mailwoman:mailwoman@127.0.0.1:5432/mailwoman"
        run: cargo test -p mw-store -p mw-engine -p mw-server -- --include-ignored
      - name: postgres logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color postgres
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # migrate-store-smoke (e1 + e12) — a focused, named gate for the `mailwoman
  # migrate-store` engine (SPEC §4.2): populate a temp SQLite store via the public
  # API, copy it into a freshly-TRUNCATEd postgres:16, and VERIFY row-count +
  # content parity (sealed columns re-open under the shared ServerKey). This is the
  # `migrate_store_sqlite_to_postgres` integration test surfaced as a first-class
  # signal (same posture as crypto-interop / mail-auth-verdicts). It requires a live
  # Postgres (DATABASE_URL_PG), so it lives with the compose stack rather than the
  # always-green `rust` job.
  migrate-store-smoke:
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: boot postgres:16 (wait healthy)
        run: docker compose -f docker-compose.ci.yml up -d --wait postgres
      - name: migrate-store SQLite -> Postgres copy + verify
        env:
          DATABASE_URL_PG: "postgres://mailwoman:mailwoman@127.0.0.1:5432/mailwoman"
        run: cargo test -p mw-store --test backend_parity migrate_store_sqlite_to_postgres -- --include-ignored --nocapture
      - name: postgres logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color postgres
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # cache-valkey (e2 + e12) — the mw-cache layered-cache gate against a live
  # valkey:8: per-class layer routing + TTL, the STRUCTURAL zero-access exclusion
  # (a PlaintextDerived value from a zero-access account is provably never written
  # to Redis/memory), and the Redis-DOWN degradation leg (falls through to store
  # with no data loss). `posture()` output matches the configured matrix (plan §3 e2).
  # The always-run tests exercise the memory-only + Redis-down paths; the
  # #[ignore]d live-Valkey tests activate here via MW_TEST_REDIS_URL +
  # --include-ignored (they self-SKIP with a clear log if the var is unset).
  cache-valkey:
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: boot valkey:8 (wait healthy)
        run: docker compose -f docker-compose.ci.yml up -d --wait valkey
      - name: mw-cache tests (live Valkey + Redis-down path)
        env:
          MW_TEST_REDIS_URL: "redis://127.0.0.1:6379"
        run: cargo test -p mw-cache -- --include-ignored
      - name: valkey logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color valkey
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # e2e-v6 (e13) — the live full-stack E2E: spawn mw-server against REAL postgres:16
  # + REAL valkey:8 + a real browser, driving admin / oauth-apikey / mcp / zeroaccess
  # / cache-posture per capability, and asserting the DB row is CIPHERTEXT for a
  # zero-access account (direct Postgres query) with NO plaintext-derived value in
  # Redis. The happy-path suite runs green against BOTH SQLite and Postgres
  # (backend parity). The full existing web + engine E2E suite runs unchanged
  # (regression gate). e13 authors apps/web/e2e/{admin,oauth-apikey,mcp,zeroaccess,
  # cache-posture}.spec.ts + the Rust integration harness (plan §3 e13).
  #
  e2e-v6:
    runs-on: ubuntu-latest
    needs: [rust, web]
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
      # Shared dev server key so sealed columns round-trip within the run (DEV ONLY,
      # never reuse). The standing `serve` reads it from MW_SERVER_KEY.
      MW_SERVER_KEY: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: boot postgres + valkey (wait healthy)
        run: docker compose -f docker-compose.ci.yml up -d --wait postgres valkey
      # The `v6` browser specs log in via the proxy path, so the standing server
      # needs a JMAP backend to proxy to: reuse the deterministic in-repo mock from
      # docker-compose.dev.yml (published on host :8181).
      - name: boot JMAP mock (wait healthy)
        run: docker compose -f docker-compose.dev.yml up -d --build --wait mock
      - name: install web deps
        run: pnpm -C apps/web install --frozen-lockfile
      - name: cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
      - name: install Playwright chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium
      - name: build the SPA (served by the standing server via MW_WEB_DIR)
        run: pnpm -C apps/web build
      - name: build mw-server (mailwoman binary)
        run: cargo build -p mw-server --release
      # ---- Leg 1: the Rust live harness. It spawns its OWN in-process server + JMAP
      # mock and drives the DoD headline proofs — the ciphertext-at-rest DIRECT
      # Postgres query + the SQLite⇄Postgres backend parity. It needs the live PG DSN
      # + Valkey URL, plus the docker-compose container names for its `docker exec
      # psql` / `valkey-cli` inspection (compose names them <project>-<svc>-1).
      # --test-threads=1 keeps the shared Postgres deterministic.
      - name: Rust live E2E harness (vs real postgres + valkey; direct-DB proofs)
        env:
          MW_E13_PG_DSN: "postgres://mailwoman:mailwoman@127.0.0.1:5432/mailwoman"
          MW_E13_REDIS_URL: "redis://127.0.0.1:6379"
          MW_E13_PG_CONTAINER: "mailwoman-ci-postgres-1"
          MW_E13_VALKEY_CONTAINER: "mailwoman-ci-valkey-1"
        run: cargo test -p mw-server --test v6_e2e -- --nocapture --test-threads=1
      # ---- Leg 2: a standing mw-server in PROXY mode (postgres + valkey, admin on,
      # proxying to the JMAP mock) for the Playwright `v6` browser project.
      - name: start mw-server (proxy mode; postgres + valkey; admin enabled)
        env:
          MW_BIND: "127.0.0.1:8090"
          MW_MODE: "proxy"
          MW_DB_PATH: "postgres://mailwoman:mailwoman@127.0.0.1:5432/mailwoman"
          MW_REDIS_URL: "redis://127.0.0.1:6379"
          MW_ADMIN_ENABLED: "true"
          MW_ADMIN_USER: "root"
          MW_ADMIN_PASSWORD: "hunter2"
          MW_COOKIE_SECURE: "false"
          MW_WEB_DIR: "apps/web/dist"
          RUST_LOG: "info"
        run: |
          ./target/release/mailwoman serve > mw-server-v6.log 2>&1 &
          echo "MW_SERVER_PID=$!" >> "$GITHUB_ENV"
      - name: wait for server health
        run: ./scripts/wait-for-health.sh http://127.0.0.1:8090/healthz 120
      # Seed an admin-approved client for the OAuth consent→code→token flow (there is
      # no client-registration endpoint — plan e11 gap c). Mirrors the Rust harness's
      # psql INSERT; ephemeral CI DB so a fixed client_id is safe.
      - name: seed an admin-approved oauth_clients row
        run: |
          docker compose -f docker-compose.ci.yml exec -T postgres \
            psql -U mailwoman -d mailwoman -c \
            "INSERT INTO oauth_clients (client_id,name,redirect_uris,approved_by,created_at) VALUES ('e2e-v6-client','E2E V6 Client','[\"https://app.example/cb\"]','root','2026-01-01T00:00:00Z') ON CONFLICT (client_id) DO NOTHING"
      - name: run Playwright E2E (v6 project vs the live server)
        env:
          MW_E2E_BASE_URL: "http://127.0.0.1:8090"
          MW_E2E_JMAP_URL: "http://127.0.0.1:8181/.well-known/jmap"
          MW_E2E_USERNAME: "testuser@example.org"
          MW_E2E_PASSWORD: "testpass"
          MW_ADMIN_USER: "root"
          MW_ADMIN_PASSWORD: "hunter2"
        run: pnpm -C apps/web exec playwright test --project=v6
      - name: server log on failure
        if: failure()
        run: cat mw-server-v6.log || true
      - name: compose logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml logs --no-color || true
          docker compose -f docker-compose.dev.yml logs --no-color mock || true
      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-v6
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: stop mw-server
        if: always()
        run: kill "${MW_SERVER_PID}" 2>/dev/null || true
      - name: tear down
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v || true
          docker compose -f docker-compose.dev.yml down -v || true

  # ===========================================================================
  # V7 (26.8.0) CI jobs — plan §3 e15/e16. SCAFFOLDED (commented) by e0; each is
  # activated by its owning executor once the implementation + the
  # docker-compose.ci.yml services (openldap / mock-assist) land. The wasm-plugin-
  # build job adds the `wasm32-wasip2` target; bridges replay RECORDED fixtures (no
  # live service in CI); a nightly live-interop job is secret-gated + off by default.
  # ===========================================================================

  # wasm-plugin-build (e15) — build EVERY first-party plugin component to
  # `wasm32-wasip2` via its own build.sh (the authoritative reproducer that refreshes
  # the committed fixtures), then assert each output is a real WASM COMPONENT (the
  # component-model preamble `00 61 73 6d 0d 00 01 00`, not a bare core module
  # `00 61 73 6d 01 00 00 00`). This is the ONLY place the component toolchain is
  # exercised end-to-end; the `jail` job below then loads the LanguageTool component
  # in the wasmtime host and proves capability + resource-limit enforcement.
  wasm-plugin-build:
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # wasm32-unknown-unknown is for the media-jail guest (a bare CORE
          # module, no component tooling) verified in the last three steps.
          targets: wasm32-wasip2, wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: build plugin components via each build.sh (wasm32-wasip2)
        run: |
          set -eux
          sh plugins/languagetool/build.sh
          sh plugins/bridge-graph/build.sh
          sh plugins/bridge-ews/build.sh
          sh plugins/bridge-gmail/build.sh
          sh plugins/nextcloud/build.sh
          sh crates/mw-plugin/tests/guest-fixture/build.sh
      - name: assert outputs are real WASM components (component-model preamble)
        run: |
          set -eu
          fail=0
          for w in \
            target/wasm32-wasip2/release/languagetool.wasm \
            target/wasm32-wasip2/release/bridge_graph.wasm \
            target/wasm32-wasip2/release/bridge_ews.wasm \
            target/wasm32-wasip2/release/bridge_gmail.wasm \
            target/wasm32-wasip2/release/nextcloud_plugin.wasm \
            crates/mw-plugin/tests/guest-fixture/target/wasm32-wasip2/release/mw_plugin_guest_fixture.wasm; do
            if [ ! -f "$w" ]; then echo "MISSING: $w"; fail=1; continue; fi
            magic="$(head -c 8 "$w" | od -An -tx1 | tr -d ' \n')"
            # component-model preamble: 0061736d 0d000100 (version 0x0d, layer 0x01)
            if [ "$magic" = "0061736d0d000100" ]; then
              echo "OK component: $w"
            else
              echo "NOT a component ($magic): $w"; fail=1
            fi
          done
          exit $fail

      # ----------------------------------------------------------------------
      # Second-layer media jail (SPEC §7.5) — crates/mw-media-wasm.
      #
      # This crate escaped every gate: it carries its OWN `[workspace]` table, so
      # `cargo build --workspace` skips it, and its build.sh was absent from the
      # list above. The only artifact under test was the committed `media.wasm`,
      # which `mw-render/src/media_jail.rs:28` pulls in via `include_bytes!` — so
      # its source could drift from the shipped binary undetected. This is the
      # module that parses hostile CFB/MSG/OFT input and re-encodes remote images,
      # so "the shipped binary provably came from the reviewed source" matters.
      #
      # It is a bare CORE module (preamble 0061736d 01000000) built for
      # wasm32-unknown-unknown, NOT a component — it deliberately cannot be added
      # to the component loop above, which would reject it.
      #
      # NOTE build.sh OVERWRITES crates/mw-media-wasm/media.wasm with its output,
      # so the committed artifact must be snapshotted before it runs.
      # ----------------------------------------------------------------------
      - name: media jail — snapshot the committed guest, then rebuild it from source
        run: |
          set -eu
          cp crates/mw-media-wasm/media.wasm "$RUNNER_TEMP/media.committed.wasm"
          sh crates/mw-media-wasm/build.sh
          cp crates/mw-media-wasm/media.wasm "$RUNNER_TEMP/media.fresh.wasm"

      # What this GATES on (each can genuinely fail, and each was negative-tested
      # against real artifacts before being shipped):
      #   * both modules have a valid core-module preamble;
      #   * the committed guest declares ZERO host imports — the jail's central
      #     claim is that the guest cannot perform I/O at all, and this is exactly
      #     what a swapped-in module would have to break;
      #   * the freshly built guest also declares zero imports;
      #   * committed and fresh export the IDENTICAL symbol set — this is what
      #     catches source/binary drift that changes the module's interface.
      #
      # What it deliberately does NOT gate on: byte-for-byte digest equality. The
      # toolchain here is floating (`dtolnay/rust-toolchain@stable`) while the
      # artifact was committed against whatever stable was current at the time, and
      # rustc codegen differs across releases; dependency paths can also be
      # embedded in panic metadata. A digest gate would therefore red permanently
      # for reasons that are not tampering. Digests ARE computed and a mismatch is
      # surfaced as a warning annotation, so drift is visible without a gate that
      # cries wolf. HONEST LIMIT: identical exports + zero imports does not prove
      # identical behaviour — the behavioural leg is the `cargo test -p mw-render`
      # step below, which runs the real jail suite against the FRESH build.
      - name: media jail — committed guest matches a fresh build (interface + zero host imports)
        run: |
          python3 - "$RUNNER_TEMP/media.committed.wasm" "$RUNNER_TEMP/media.fresh.wasm" <<'PY'
          import hashlib, sys

          CORE = bytes([0x00, 0x61, 0x73, 0x6D, 0x01, 0x00, 0x00, 0x00])
          KIND = {0: "func", 1: "table", 2: "memory", 3: "global"}

          def uleb(b, i):
              val = shift = 0
              while True:
                  if i >= len(b):
                      raise ValueError("truncated LEB128")
                  c = b[i]; i += 1
                  val |= (c & 0x7F) << shift
                  if not c & 0x80:
                      return val, i
                  shift += 7
                  if shift > 63:
                      raise ValueError("LEB128 too long")

          def name(b, i):
              n, i = uleb(b, i)
              if i + n > len(b):
                  raise ValueError("truncated name")
              return b[i:i + n].decode("utf-8", "replace"), i + n

          def interface(path):
              b = open(path, "rb").read()
              if b[:8] != CORE:
                  raise ValueError(f"not a wasm core module (preamble {b[:8].hex()})")
              imports, exports, i = [], [], 8
              while i < len(b):
                  sec = b[i]; i += 1
                  size, i = uleb(b, i)
                  end = i + size
                  if end > len(b):
                      raise ValueError(f"section {sec} overruns the file")
                  j = i
                  if sec == 2:
                      count, j = uleb(b, j)
                      for _ in range(count):
                          mod, j = name(b, j)
                          fld, j = name(b, j)
                          k = b[j]; j += 1
                          if k == 0:
                              _, j = uleb(b, j)
                          elif k in (1, 2):
                              if k == 1:
                                  j += 1
                              lim = b[j]; j += 1
                              _, j = uleb(b, j)
                              if lim & 0x01:
                                  _, j = uleb(b, j)
                          elif k == 3:
                              j += 2
                          imports.append(f"{mod}.{fld} ({KIND.get(k, k)})")
                  elif sec == 7:
                      count, j = uleb(b, j)
                      for _ in range(count):
                          nm, j = name(b, j)
                          k = b[j]; j += 1
                          _, j = uleb(b, j)
                          exports.append(f"{nm} ({KIND.get(k, k)})")
                  i = end
              return sorted(imports), sorted(exports), hashlib.sha256(b).hexdigest()

          committed, fresh = sys.argv[1], sys.argv[2]
          errs = []
          try:
              ci, ce, cd = interface(committed)
              fi, fe, fd = interface(fresh)
          except Exception as e:
              sys.exit(f"FAIL: could not read a media-jail guest as a core module: {e}")

          print(f"committed  sha256={cd}\n  imports({len(ci)}): {ci}\n  exports({len(ce)}): {ce}")
          print(f"fresh      sha256={fd}\n  imports({len(fi)}): {fi}\n  exports({len(fe)}): {fe}")

          if ci:
              errs.append(f"committed media.wasm declares {len(ci)} host import(s) — the "
                          f"media jail must have NONE (it must not be able to do I/O): {ci}")
          if fi:
              errs.append(f"freshly built media.wasm declares {len(fi)} host import(s) — "
                          f"the source no longer produces a zero-import guest: {fi}")
          if ce != fe:
              only_c = sorted(set(ce) - set(fe))
              only_f = sorted(set(fe) - set(ce))
              errs.append("committed media.wasm and a fresh build of its source export "
                          "DIFFERENT symbols — the committed artifact has drifted from "
                          f"crates/mw-media-wasm/src. only in committed: {only_c}; "
                          f"only in fresh: {only_f}. Re-run crates/mw-media-wasm/build.sh "
                          "and commit the result.")

          if cd != fd:
              print(f"::warning file=crates/mw-media-wasm/media.wasm::media.wasm is not "
                    f"byte-identical to a fresh build (committed {cd[:16]}..., fresh "
                    f"{fd[:16]}...). Expected under a floating rustc — NOT a tamper signal "
                    f"on its own. Interface and behaviour are gated separately.")
          else:
              print("digests match byte-for-byte (stronger than this job requires)")

          if errs:
              print("\nFAIL:")
              for e in errs:
                  print("  -", e)
              sys.exit(1)
          print("\nmedia jail verified: zero host imports, interface matches a fresh build.")
          PY

      # The behavioural half. `media_jail.rs` pulls the guest in with
      # `include_bytes!`, and the step above left the FRESH build in place, so this
      # compiles the real jail against the just-rebuilt module and runs the real
      # suite (CFB/MSG/OFT parse + image re-encode). The `rust` job runs the same
      # tests against the COMMITTED module, so together they show both modules
      # satisfy the same behavioural contract — which is the part an interface
      # comparison alone cannot establish.
      - name: media jail — the freshly built guest passes the real jail suite
        run: cargo test -p mw-render

  # jail (e15) — load the REAL LanguageTool WASM component in the wasmtime host and
  # assert the SECURITY CORE (plan §22 / §7.5): loads only when its capability is
  # granted; host `http-fetch` is DENIED outside the net allowlist; DENIED without the
  # net grant; the DLP hook is DENIED without its capability; and a busy/oversized
  # guest trips the deadline/memory ceiling cleanly (LimitExceeded, host survives).
  # Builds the component fresh first so the committed fixture can never drift from the
  # WIT. Runs on the host target (loads the wasm bytes) — no compose service needed.
  jail:
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - name: (re)build the LanguageTool component fixture
        run: sh plugins/languagetool/build.sh
      - name: plugin jail — capability + resource-limit enforcement
        run: cargo test -p languagetool --test jail_load

  # directory-vs-openldap (e15) — GAL search / group expand-before-send / S-MIME cert
  # (userCertificate;binary) + photo (jpegPhoto) lookup / multi-directory priority /
  # StartTLS/LDAPS / LDAP-bind against REAL OpenLDAP (seeded LDIF at
  # scripts/openldap/ldifs/), via the env-gated (#[ignore]) live tests in mw-directory.
  # The tests self-SKIP with a clear log if MW_TEST_LDAP_URL is unset (never a silent
  # pass); this job sets it, so the live legs run.
  directory-vs-openldap:
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: boot openldap (wait healthy)
        run: docker compose -f docker-compose.ci.yml up -d --wait openldap
      - name: mw-directory live conformance (GAL/group/cert/photo/bind)
        env:
          MW_TEST_LDAP_URL: "ldap://127.0.0.1:1389"
          MW_TEST_LDAPS_URL: "ldaps://127.0.0.1:1636"
          MW_TEST_LDAP_BASE_DN: "dc=example,dc=com"
          MW_TEST_LDAP_BIND_DN: "cn=admin,dc=example,dc=com"
          MW_TEST_LDAP_BIND_PW: "adminpassword"
        run: cargo test -p mw-directory -- --include-ignored
      - name: openldap logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color openldap
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # assist-mock (e15) — Assist capability grant/deny, redaction (E2EE never
  # forwarded), content-free audit, send-always-gated, against the deterministic
  # in-repo mock OpenAI-compatible (+ Anthropic) endpoint (scripts/mock-assist).
  # Deterministic + offline. Nightly optional Ollama/OpenAI/Anthropic behind secrets
  # is the separate `live-interop` job. The #[ignore]d live legs self-SKIP if
  # MW_TEST_ASSIST_URL is unset; this job sets it.
  assist-mock:
    runs-on: ubuntu-latest
    needs: [rust]
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: boot mock-assist (wait healthy)
        run: docker compose -f docker-compose.ci.yml up -d --build --wait mock-assist
      - name: mw-assist gateway tests vs the mock endpoint
        env:
          MW_TEST_ASSIST_URL: "http://127.0.0.1:8199"
        run: cargo test -p mw-assist -- --include-ignored
      - name: mock-assist logs on failure
        if: failure()
        run: docker compose -f docker-compose.ci.yml logs --no-color mock-assist
      - name: tear down
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v

  # bridge-fixtures (e15) — replay the RECORDED request/response fixtures for
  # Graph/EWS/Gmail THROUGH the real engine (no live service in CI): the bridge, loaded
  # via mw-plugin, serves mail indistinguishably from IMAP; reactions/voting/recall/
  # Focused-sync mapping paths verified against the recorded pairs.
  bridge-fixtures:
    runs-on: ubuntu-latest
    needs: [rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: bridge fixture replay (Graph/EWS/Gmail through the real engine)
        run: cargo test -p bridge-graph -p bridge-ews -p bridge-gmail

  # live-interop (e15) — NIGHTLY, secret-gated, NON-blocking. Hits real M365 /
  # Workspace test tenants + real Ollama/OpenAI/Anthropic endpoints ONLY when the
  # corresponding secrets are present. It runs solely on `schedule`/`workflow_dispatch`
  # (never on push/pull_request, so PR CI is never blocked or slowed), and
  # continue-on-error keeps a provider outage or an expired tenant credential from
  # reddening even the nightly pipeline — a live-interop failure is a signal to
  # investigate, not a merge gate. Live scenarios live behind the same #[ignore] live
  # tests the fixture/mock jobs exercise; the env/secrets below select the live legs.
  live-interop:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: bridges vs real tenants (Graph/EWS/Gmail) — only if tenant secrets set
        env:
          MW_LIVE_GRAPH_TENANT: ${{ secrets.MW_LIVE_GRAPH_TENANT }}
          MW_LIVE_GRAPH_CLIENT_ID: ${{ secrets.MW_LIVE_GRAPH_CLIENT_ID }}
          MW_LIVE_GRAPH_TOKEN: ${{ secrets.MW_LIVE_GRAPH_TOKEN }}
          MW_LIVE_EWS_URL: ${{ secrets.MW_LIVE_EWS_URL }}
          MW_LIVE_EWS_USER: ${{ secrets.MW_LIVE_EWS_USER }}
          MW_LIVE_EWS_PASS: ${{ secrets.MW_LIVE_EWS_PASS }}
          MW_LIVE_GMAIL_TOKEN: ${{ secrets.MW_LIVE_GMAIL_TOKEN }}
        run: |
          if [ -z "${MW_LIVE_GRAPH_TOKEN:-}${MW_LIVE_EWS_URL:-}${MW_LIVE_GMAIL_TOKEN:-}" ]; then
            echo "no bridge tenant secrets present — skipping live bridge interop"
          else
            cargo test -p bridge-graph -p bridge-ews -p bridge-gmail -- --include-ignored
          fi
      - name: Assist vs real endpoints (Ollama/OpenAI/Anthropic) — only if secrets set
        env:
          MW_LIVE_OPENAI_URL: ${{ secrets.MW_LIVE_OPENAI_URL }}
          MW_LIVE_OPENAI_KEY: ${{ secrets.MW_LIVE_OPENAI_KEY }}
          MW_LIVE_ANTHROPIC_KEY: ${{ secrets.MW_LIVE_ANTHROPIC_KEY }}
          MW_LIVE_OLLAMA_URL: ${{ secrets.MW_LIVE_OLLAMA_URL }}
        run: |
          if [ -z "${MW_LIVE_OPENAI_KEY:-}${MW_LIVE_ANTHROPIC_KEY:-}${MW_LIVE_OLLAMA_URL:-}" ]; then
            echo "no Assist endpoint secrets present — skipping live Assist interop"
          else
            cargo test -p mw-assist -- --include-ignored
          fi

  # e2e-v7 (e16/e2ewire-v7) — the live full-stack per-capability E2E: mw-server against
  # REAL OpenLDAP + a real loaded WASM plugin (jail: out-of-allowlist DENIED, deadline/
  # memory trip observed, unsigned⇒banner) + the mock Assist endpoint + bridges via
  # recorded fixtures + MSG/OFT/DOCX round-trip. Full existing web+engine suites green.
  # e16 authored apps/web/e2e/{plugins,directory,passwd,assist,bridges}.spec.ts + the
  # Rust integration harness; this job (+ the `v7` Playwright project) mirrors `e2e-v6`.
  #
  # Two legs, per the `e2e-v6` shape:
  #   Leg 1 — the Rust live harness (crates/mw-server/tests/v7_e2e.rs) spawns its OWN
  #     in-process server + mock Assist endpoint and loads the REAL committed
  #     wasm32-wasip2 components into the wasmtime jail; it drives the DEEP proofs (jail
  #     capability/allowlist/resource-limit enforcement, the plugin-backed-account JMAP
  #     surface, Assist E2EE redaction, directory-vs-real-OpenLDAP, RFC-3062 exop). It
  #     reaches the seeded OpenLDAP via MW_E16_LDAP_URL and self-SKIPS loudly (never a
  #     silent pass) if LDAP is unreachable.
  #   Leg 2 — a standing mw-server in PROXY mode (postgres + valkey, admin on, fronting
  #     the JMAP mock) for the Playwright `v7` browser project, which asserts the
  #     browser-facing V7 HTTP contract (every surface MOUNTED; Assist governance;
  #     plugin registry; password policy; bridges registry).
  e2e-v7:
    runs-on: ubuntu-latest
    needs: [rust, web]
    env:
      DOCKER_BUILDKIT: "1"
      COMPOSE_DOCKER_CLI_BUILD: "1"
      # Shared dev server key so sealed columns round-trip within the run (DEV ONLY,
      # never reuse). The standing `serve` reads it from MW_SERVER_KEY.
      MW_SERVER_KEY: "deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: boot postgres + valkey (wait healthy)
        run: docker compose -f docker-compose.ci.yml up -d --wait postgres valkey
      # OpenLDAP (seeded LDIF at scripts/openldap/ldifs/) for the directory/GAL + RFC-3062
      # legs, and the deterministic in-repo mock Assist endpoint (scripts/mock-assist) for
      # the Assist governance legs — both added by e15 to docker-compose.ci.yml.
      - name: boot openldap + mock-assist (wait healthy)
        run: docker compose -f docker-compose.ci.yml up -d --build --wait openldap mock-assist
      # The `v7` browser specs log in via the proxy path, so the standing server needs a
      # JMAP backend to proxy to: reuse the deterministic in-repo mock from
      # docker-compose.dev.yml (published on host :8181), exactly as `e2e-v6` does.
      - name: boot JMAP mock (wait healthy)
        run: docker compose -f docker-compose.dev.yml up -d --build --wait mock
      - name: install web deps
        run: pnpm -C apps/web install --frozen-lockfile
      - name: cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/pnpm-lock.yaml') }}
      - name: install Playwright chromium
        run: pnpm -C apps/web exec playwright install --with-deps chromium
      # Build the plugin components the Rust harness loads into the wasmtime jail
      # (LanguageTool + the Graph bridge) fresh from their authoritative build.sh, so the
      # committed wasm32-wasip2 fixtures can never drift from the WIT (the wasm-plugin-build
      # job builds + verifies the full set; here we build only what the v7 harness loads).
      - name: build plugin components (wasm32-wasip2)
        run: |
          set -eux
          sh plugins/languagetool/build.sh
          sh plugins/bridge-graph/build.sh
      - name: build the SPA (served by the standing server via MW_WEB_DIR)
        run: pnpm -C apps/web build
      - name: build mw-server (mailwoman binary)
        run: cargo build -p mw-server --release
      # ---- Leg 1: the Rust live harness. It spawns its OWN in-process server + mock
      # Assist endpoint and loads the REAL committed components into the wasmtime jail;
      # the directory / RFC-3062 legs reach the seeded OpenLDAP via MW_E16_LDAP_URL.
      # --test-threads=1 keeps the shared OpenLDAP deterministic.
      - name: Rust live E2E harness (jail + directory-vs-OpenLDAP + Assist redaction proofs)
        env:
          MW_E16_LDAP_URL: "ldap://127.0.0.1:1389"
        run: cargo test -p mw-server --test v7_e2e -- --nocapture --test-threads=1
      # ---- Leg 2: a standing mw-server in PROXY mode (postgres + valkey, admin on,
      # proxying to the JMAP mock) for the Playwright `v7` browser project. The password-
      # change backend defaults to `local` (policy served; wrong-current ⇒ 400/403). The
      # service-bind password for the seeded directory endpoint comes from
      # MW_DIRECTORY_BIND_DN/PW (0008 has no password column).
      - name: start mw-server (proxy mode; postgres + valkey; admin enabled)
        env:
          MW_BIND: "127.0.0.1:8090"
          MW_MODE: "proxy"
          MW_DB_PATH: "postgres://mailwoman:mailwoman@127.0.0.1:5432/mailwoman"
          MW_REDIS_URL: "redis://127.0.0.1:6379"
          MW_ADMIN_ENABLED: "true"
          MW_ADMIN_USER: "root"
          MW_ADMIN_PASSWORD: "hunter2"
          MW_COOKIE_SECURE: "false"
          MW_WEB_DIR: "apps/web/dist"
          MW_DIRECTORY_BIND_DN: "cn=admin,dc=example,dc=com"
          MW_DIRECTORY_BIND_PW: "adminpassword"
          RUST_LOG: "info"
        run: |
          ./target/release/mailwoman serve > mw-server-v7.log 2>&1 &
          echo "MW_SERVER_PID=$!" >> "$GITHUB_ENV"
      - name: wait for server health
        run: ./scripts/wait-for-health.sh http://127.0.0.1:8090/healthz 120
      # Seed the deployment-shape V7 rows the standing server persists in the 0008 tables:
      # a `directory_config` endpoint pointing at the seeded OpenLDAP and a `bridge_accounts`
      # binding for the Graph bridge. Best-effort (ON CONFLICT DO NOTHING; never fatal) and
      # mirrors the `e2e-v6` post-health psql seed. The browser specs assert the MOUNT
      # contract and tolerate an unconfigured surface (an honest 501 / empty registry), so
      # they stay green regardless; the CONFIGURED/loaded behavior (GAL results, the
      # plugin-backed account) is proven in Leg 1's Rust harness against the real services.
      - name: seed directory_config + bridge_accounts (deployment-shape rows)
        run: |
          docker compose -f docker-compose.ci.yml exec -T postgres \
            psql -U mailwoman -d mailwoman -c \
            "INSERT INTO directory_config (id,url,base_dn,bind_dn,tls,priority,attr_map,enabled) VALUES ('ci-openldap','ldap://127.0.0.1:1389','dc=example,dc=com','cn=admin,dc=example,dc=com','none',0,'{}',1) ON CONFLICT (id) DO NOTHING" || true
          docker compose -f docker-compose.ci.yml exec -T postgres \
            psql -U mailwoman -d mailwoman -c \
            "INSERT INTO bridge_accounts (account_id,bridge_id,oauth_ref,extra) VALUES ('e2e-v7-graph','bridge-graph',NULL,'{}') ON CONFLICT (account_id) DO NOTHING" || true
      - name: run Playwright E2E (v7 project vs the live server)
        env:
          MW_E2E_BASE_URL: "http://127.0.0.1:8090"
          MW_E2E_JMAP_URL: "http://127.0.0.1:8181/.well-known/jmap"
          MW_E2E_USERNAME: "testuser@example.org"
          MW_E2E_PASSWORD: "testpass"
          MW_E2E_ASSIST_URL: "http://127.0.0.1:8199"
          MW_ADMIN_USER: "root"
          MW_ADMIN_PASSWORD: "hunter2"
        run: pnpm -C apps/web exec playwright test --project=v7
      - name: server log on failure
        if: failure()
        run: cat mw-server-v7.log || true
      - name: compose logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.ci.yml logs --no-color || true
          docker compose -f docker-compose.dev.yml logs --no-color mock || true
      - name: upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-v7
          path: apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 7
      - name: stop mw-server
        if: always()
        run: kill "${MW_SERVER_PID}" 2>/dev/null || true
      - name: tear down
        if: always()
        run: |
          docker compose -f docker-compose.ci.yml down -v || true
          docker compose -f docker-compose.dev.yml down -v || true
