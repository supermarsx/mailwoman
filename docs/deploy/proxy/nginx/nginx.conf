# nginx main configuration for the Mailwoman conformance cell.
#
# This is the CONTAINER-COMPLETE file (mounted at /etc/nginx/nginx.conf). If you
# already run nginx and just want the Mailwoman vhost, you do NOT need this file
# — take `mailwoman.conf` and drop it in your conf.d/, but read the `map` note
# below first, because that one directive cannot live inside a server block.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" xff="$http_x_forwarded_for"';
    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # ---------------------------------------------------------------------
    # WebSocket upgrade mapping.
    #
    # This MUST be at http{} scope — nginx rejects `map` inside a server{} or
    # location{} block. If you are dropping mailwoman.conf into an existing
    # conf.d/, copy these four lines into your main nginx.conf too, or the
    # /jmap/ws upgrade will not pass through.
    # ---------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Do not compress event streams. gzip buffers to fill a compression window,
    # which is a second way to break SSE even with proxy_buffering off.
    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_proxied      no-cache no-store private expired auth;
    gzip_min_length   1024;

    include /etc/nginx/mailwoman/mailwoman.conf;
}
