# Mailwoman vhost for nginx.
#
# Drop-in form: copy to /etc/nginx/conf.d/mailwoman.conf, adjust `upstream`,
# `server_name` and the TLS paths, and copy the `map $http_upgrade` block from
# nginx.conf into your http{} scope (it cannot live in here).
#
# nginx is the baseline proxy and also the WORST default for this application.
# Three stock defaults each break something, and all three are corrected below:
#
#   proxy_buffering on          -> SSE arrives in batches or not at all
#   client_max_body_size 1m     -> attachment uploads rejected with nginx's own
#                                  HTML 413 long before the app's 50 MB limit
#   proxy_http_version 1.0      -> no WebSocket upgrade, no keepalive upstream
#
# Ports here are the conformance-cell ports (8080 plain / 8443 TLS). A real
# deployment uses 80/443; nothing else changes.

upstream mailwoman {
    server app:8080;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# Shared proxy directives.
#
# `Host $http_host` (NOT `$host`): $host strips the port, and the application
# compares Origin against Host for CSRF and derives the WebAuthn RP ID from it.
# On a non-default port, $host produces a Host that does not match the browser's
# Origin and logins start failing in ways that are hard to trace.
#
# `X-Forwarded-For $remote_addr` OVERWRITES rather than appends. This is the
# single-edge-proxy shape and it is what most people actually run: whatever the
# client claims is discarded here, so the app receives exactly one hop and a
# forged header cannot survive.
#
# If you run a CHAIN (CDN -> nginx -> app) you want the append form instead:
#
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#
# but that is only safe if EVERY upstream hop is listed in MW_TRUSTED_PROXIES.
# The app walks the header right-to-left and stops at the first address that is
# not a trusted proxy, so an unlisted hop makes it stop early — and a hop listed
# by mistake lets that host claim any client address it likes.
# ---------------------------------------------------------------------------

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Well above the app's own 50 MB upload cap ON PURPOSE. If nginx's limit sat
    # at or below the app's, an oversized upload would get nginx's HTML 413 and
    # the client would never see the app's JSON error. Let the app be the one
    # that says no.
    client_max_body_size 100m;

    location / {
        proxy_pass http://mailwoman;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;
        # Drop any RFC 7239 header the client invented; we do not speak it here.
        proxy_set_header Forwarded         "";
        # Required for the keepalive upstream pool: with proxy_http_version 1.1
        # nginx must not forward the client's Connection header.
        proxy_set_header Connection        "";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ---- WebSocket JMAP push (RFC 8887) --------------------------------------
    # Forward the upgrade and hold the tunnel open. The server heartbeats every
    # 30 s, so 3600 s is generous; anything under ~60 s will cut idle sockets.
    location /jmap/ws {
        proxy_pass http://mailwoman;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Forwarded         "";

        # The upgrade handshake. Connection MUST carry $connection_upgrade here,
        # not the empty value the other locations use for the keepalive pool.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ---- SSE: the JMAP EventSource fallback ----------------------------------
    location /jmap/eventsource {
        proxy_pass http://mailwoman;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Forwarded         "";
        # Required for the keepalive upstream pool: with proxy_http_version 1.1
        # nginx must not forward the client's Connection header.
        proxy_set_header Connection        "";
        # An EventSource cannot negotiate encodings usefully and gzip would
        # buffer the stream, so ask upstream for identity.
        proxy_set_header Accept-Encoding   "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # ---- SSE: the assistant stream -------------------------------------------
    # This one is a POST that returns text/event-stream, so it does not look like
    # an event stream to any rule keyed on the method or on a /eventsource path.
    # It needs request buffering off as well: nginx would otherwise read the
    # whole request before contacting upstream, which is harmless here but adds
    # latency to a streaming interaction.
    location = /api/assist/invoke {
        proxy_pass http://mailwoman;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Forwarded         "";
        # Required for the keepalive upstream pool: with proxy_http_version 1.1
        # nginx must not forward the client's Connection header.
        proxy_set_header Connection        "";
        proxy_set_header Accept-Encoding   "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # ---- Large bodies: attachment upload and mailbox import ------------------
    # Stream to the app instead of spooling the whole body to disk first.
    location ~ ^/(jmap/upload|api/import)/ {
        proxy_pass http://mailwoman;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Forwarded         "";
        # Required for the keepalive upstream pool: with proxy_http_version 1.1
        # nginx must not forward the client's Connection header.
        proxy_set_header Connection        "";

        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

# ---------------------------------------------------------------------------
# TLS listener. Same body, plus the TLS termination that makes the app see
# X-Forwarded-Proto: https — which is what drives the Secure cookie flag and
# the HSTS header on the application side.
#
# The certificate here is the throwaway self-signed one from
# docs/deploy/proxy/tls/gen-certs.sh. A real deployment points these at a CA-
# issued pair, or skips nginx TLS entirely and uses the app's built-in ACME.
# ---------------------------------------------------------------------------
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /certs/server.crt;
    ssl_certificate_key /certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 100m;

    # HSTS is emitted by the application when the effective scheme is https, so
    # it is NOT set here — two sources for one header is how you end up with a
    # duplicate Strict-Transport-Security and an inconsistent max-age. If you
    # front an older build that does not emit it, add:
    #   add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://mailwoman;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Forwarded         "";
        # Required for the keepalive upstream pool: with proxy_http_version 1.1
        # nginx must not forward the client's Connection header.
        proxy_set_header Connection        "";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /jmap/ws {
        proxy_pass http://mailwoman;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Forwarded         "";

        # The upgrade handshake. Connection MUST carry $connection_upgrade here,
        # not the empty value the other locations use for the keepalive pool.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /jmap/eventsource {
        proxy_pass http://mailwoman;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Forwarded         "";
        # Required for the keepalive upstream pool: with proxy_http_version 1.1
        # nginx must not forward the client's Connection header.
        proxy_set_header Connection        "";
        proxy_set_header Accept-Encoding   "";

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    location = /api/assist/invoke {
        proxy_pass http://mailwoman;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Forwarded         "";
        # Required for the keepalive upstream pool: with proxy_http_version 1.1
        # nginx must not forward the client's Connection header.
        proxy_set_header Connection        "";
        proxy_set_header Accept-Encoding   "";

        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    location ~ ^/(jmap/upload|api/import)/ {
        proxy_pass http://mailwoman;
        proxy_http_version 1.1;

        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header Forwarded         "";
        # Required for the keepalive upstream pool: with proxy_http_version 1.1
        # nginx must not forward the client's Connection header.
        proxy_set_header Connection        "";

        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
