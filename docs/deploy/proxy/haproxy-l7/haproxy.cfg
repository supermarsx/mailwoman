# HAProxy configuration for the Mailwoman conformance cell — LAYER 7.
#
# This is the ordinary `mode http` shape: HAProxy terminates TLS, parses HTTP,
# and sets the forwarded headers. For the TCP/PROXY-protocol shape see the
# sibling docs/deploy/proxy/haproxy-l4/haproxy.cfg, which is a genuinely
# different deployment rather than a variation on this one.
#
# ---------------------------------------------------------------------------
# What is HAProxy-specific here
# ---------------------------------------------------------------------------
#
# * `timeout tunnel` is the one that matters for WebSocket. Once a connection is
#   upgraded, HAProxy stops applying `timeout client`/`timeout server` and
#   applies `timeout tunnel` instead. Leave it at the default and JMAP push
#   sockets are cut roughly every `timeout client` regardless of the heartbeat.
#
# * `option forwardfor` APPENDS the peer address to any X-Forwarded-For the
#   client sent. That is the right thing in a proxy chain and the wrong thing at
#   the edge, so it is not used: the header is deleted and re-set from %[src],
#   which produces exactly one hop that the client cannot influence.
#
# * HAProxy applies no request body size limit at all, so there is nothing to
#   raise for 50 MB attachments. That also means it will never be HAProxy that
#   rejects an oversized upload — the application's JSON 413 is what the client
#   sees, which is what we want.
#
# * HAProxy does not buffer whole responses, so server-sent events stream
#   correctly with no directive. What does bite is `timeout server`: an assistant
#   turn that thinks for longer than that looks like a dead backend. Streaming
#   paths therefore go to their own backend with a long server timeout.

global
    log stdout format raw local0 info
    maxconn 4096
    # Modern default TLS settings for the 8443 frontend.
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 300s
    timeout server 300s
    timeout http-request 30s
    timeout http-keep-alive 1m
    # WebSocket and any other upgraded connection lives under this one.
    timeout tunnel 3600s

# ---------------------------------------------------------------------------
# Frontends
# ---------------------------------------------------------------------------

frontend fe_http
    bind :8080

    # Discard everything the client asserted about its own provenance BEFORE
    # setting our own. Deleting first matters: set-header on a header the client
    # sent twice would otherwise leave the second copy in place.
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Port
    http-request del-header X-Forwarded-Host
    http-request del-header X-Real-IP
    http-request del-header Forwarded

    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Real-IP %[src]
    http-request set-header X-Forwarded-Proto http
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]

    acl mw_stream path /jmap/eventsource /api/assist/invoke
    use_backend be_app_stream if mw_stream
    default_backend be_app

frontend fe_https
    bind :8443 ssl crt /certs/server.pem alpn h2,http/1.1

    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Port
    http-request del-header X-Forwarded-Host
    http-request del-header X-Real-IP
    http-request del-header Forwarded

    http-request set-header X-Forwarded-For %[src]
    http-request set-header X-Real-IP %[src]
    # This is what drives the Secure cookie flag and HSTS on the application
    # side. A TLS frontend that forgets it ships session cookies without Secure.
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]

    acl mw_stream path /jmap/eventsource /api/assist/invoke
    use_backend be_app_stream if mw_stream
    default_backend be_app

# ---------------------------------------------------------------------------
# Backends
# ---------------------------------------------------------------------------

backend be_app
    option httpchk GET /healthz
    http-check expect status 200
    server app app:8080 check inter 5s fall 3 rise 2

# Same server, longer server timeout. Used only for the two streaming paths, so
# a long-idle event stream is not mistaken for a hung backend while ordinary
# requests keep a tight 300 s ceiling.
backend be_app_stream
    timeout server 3600s
    server app app:8080
