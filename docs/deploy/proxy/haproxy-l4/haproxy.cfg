# HAProxy configuration for the Mailwoman conformance cell — LAYER 4.
#
# This is the distinctive cell. HAProxy runs in `mode tcp` and does NOT
# terminate TLS: it forwards the raw stream to the application, which holds the
# certificate and does its own TLS. There is no HTTP parsing anywhere in this
# file, so there are no forwarded headers to set — the client's address is
# carried out of band, in a PROXY protocol v2 header prefixed to the connection.
#
# ---------------------------------------------------------------------------
# Why this shape exists
# ---------------------------------------------------------------------------
#
# Mailwoman ships a built-in ACME client (MW_ACME, tokio-rustls-acme). For it to
# work the application has to be the endpoint that answers the TLS-ALPN-01
# challenge, which means TLS cannot be terminated in front of it. TLS
# passthrough behind an L4 balancer is therefore a first-class deployment, not
# an exotic one — and it is also what you get from an AWS NLB, an nginx `stream`
# block with `proxy_protocol on`, or an Envoy TCP proxy.
#
# The cost is that the application's peer address becomes the balancer's for
# every connection. Without PROXY protocol, the OAuth scoped-key IP allowlist,
# the per-key rate limit and every audit-log IP would all record the balancer.
#
# ---------------------------------------------------------------------------
# What the application must be configured with
# ---------------------------------------------------------------------------
#
#   MW_TLS_CERT / MW_TLS_KEY   the app terminates TLS itself (or MW_ACME)
#   MW_PROXY_PROTOCOL=require  refuse any connection with no PROXY header, and
#                              refuse a PROXY header from a peer that is not in
#                              MW_TRUSTED_PROXIES
#   MW_TRUSTED_PROXIES=<cidr>  must contain this balancer's address
#
# `require` rather than `accept` is the right setting whenever the app port is
# reachable only through the balancer, because `accept` would let anything that
# can reach the port choose its own source address.
#
# Parsing of the v2 header is crates/mw-server/src/proxy_protocol.rs (t20-e2).
#
# ---------------------------------------------------------------------------
# Health checks
# ---------------------------------------------------------------------------
#
# `check-send-proxy` is not optional here. A health check opens a plain TCP
# connection with no PROXY header, and an application running with
# MW_PROXY_PROTOCOL=require will drop exactly that — so the backend would be
# marked down while serving traffic perfectly well. `check-send-proxy` makes the
# check carry the header too.

global
    log stdout format raw local0 info
    maxconn 4096

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 5s
    # In TCP mode there is no separate tunnel timeout — every connection IS a
    # tunnel. These have to be long enough for an idle WebSocket carrying the
    # 30 s server heartbeat.
    timeout client 3600s
    timeout server 3600s

frontend fe_tls_passthrough
    bind :8443
    default_backend be_app_tls

backend be_app_tls
    # send-proxy-v2: prefix each connection with the binary PROXY v2 header
    # carrying the real client address. Use send-proxy (v1, an ASCII line) only
    # if the backend cannot parse v2; the application accepts both.
    server app app-tls:8443 send-proxy-v2 check check-send-proxy inter 5s fall 3 rise 2
