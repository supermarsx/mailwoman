# Mailwoman vhosts for Apache httpd 2.4.
#
# Drop-in form: Include this from your httpd.conf (or copy it into
# conf.d/sites-available), adjust the backend address, ServerName and the TLS
# paths. Requires mod_proxy, mod_proxy_http, mod_proxy_wstunnel, mod_headers.
#
# ---------------------------------------------------------------------------
# The two Apache-specific traps
# ---------------------------------------------------------------------------
#
# 1. ProxyPreserveHost defaults to OFF, which rewrites the Host header to the
#    BACKEND's name. Mailwoman derives the OAuth DCR issuer URL and the WebAuthn
#    RP ID from Host. With ProxyPreserveHost Off, registered passkeys silently
#    stop validating because the RP ID becomes the internal backend name. It is
#    On below and must stay On.
#
# 2. Apache's forwarded headers work the opposite way round from nginx's. With
#    ProxyAddHeaders On (the default) mod_proxy APPENDS the peer address to any
#    X-Forwarded-For already present — including one the client made up. So the
#    correct pattern here is not to SET the header but to UNSET the client's and
#    let mod_proxy add exactly one hop:
#
#        RequestHeader unset X-Forwarded-For
#
#    The outgoing header is then precisely the real client address. Setting it
#    explicitly instead would produce "<client>, <client>", because mod_proxy
#    appends after mod_headers has run.
#
# mod_proxy does NOT add X-Forwarded-Proto, so that one is set per vhost as a
# literal — the vhost already knows whether it is the TLS one.
#
# ---------------------------------------------------------------------------
# Server-sent events on Apache
# ---------------------------------------------------------------------------
#
# mod_proxy_http streams the response through as it reads it; it does not hold
# the whole body. What actually breaks SSE on Apache is something else in the
# output chain buffering to fill a window — in practice mod_deflate, and
# mod_cache if it is caching the path. Both are handled below (no-gzip per
# location, and neither module is loaded in the shipped httpd.conf).
#
# Note that Apache does NOT honour `X-Accel-Buffering: no`. That header is an
# nginx convention; the application emits it for nginx's benefit and Apache
# simply ignores it. Do not rely on it here.
#
# ---------------------------------------------------------------------------
# Timeouts
# ---------------------------------------------------------------------------
#
# ProxyTimeout is server/vhost scope only — it cannot be set per <Location>. So
# the long-lived paths get their timeout on the ProxyPass worker itself
# (`timeout=3600`), which is per-worker and does work. This is why each
# streaming path has its own ProxyPass line rather than falling through to the
# catch-all.

# Strip anything the client asserted about its own provenance. This happens for
# every vhost below.
RequestHeader unset X-Forwarded-For
RequestHeader unset X-Forwarded-Host
RequestHeader unset X-Forwarded-Proto
RequestHeader unset X-Forwarded-Port
RequestHeader unset X-Real-IP
RequestHeader unset Forwarded

# LimitRequestBody is NOT what lets 50 MB attachments through here, and it is
# worth being blunt about that because the value looks load-bearing and is not:
# the directive is not enforced on reverse-proxied requests at all. mod_proxy
# reads the body itself rather than through the core's client-block reader, so
# the limit is never consulted. MEASURED on httpd 2.4.68 — with
# `LimitRequestBody 1000000` set, a 20 MB POST still reached the application and
# came back with the app's own 401.
#
# It is kept because it DOES apply to anything this server handles itself rather
# than proxying, so a locally-served path added to this file later stays bounded.
# Do not raise or lower it expecting the upload behaviour to change.
LimitRequestBody 104857600

# ---------------------------------------------------------------------------
# Early backend responses on a large request body — Apache-specific, REQUIRED
# ---------------------------------------------------------------------------
#
# The application answers some requests before it has consumed the whole body:
# an oversized upload gets a 413 after 50 MB, and an unauthenticated one gets a
# 401 straight away. On a POOLED backend connection, mod_proxy_http cannot relay
# that early response — it abandons the exchange and synthesises its own 5xx:
#
#   AH01086: read less bytes of request body than expected (got 0, expected ...)
#   AH10154: pass request body failed to ... with status 500
#
# The client then gets an HTML 500 or 502 where every other proxy in
# docs/deploy/proxy/ delivers the application's JSON error. Measured on
# httpd 2.4.68: a 20 MB unauthenticated upload returned `500 text/html` with the
# pool on, and `401 application/json` with `proxy-nokeepalive` set. Nothing else
# tried made a difference — `proxy-sendcl` and `proxy-sendchunked` both still
# produced the 500.
#
# Forcing a fresh backend connection for these two paths costs connection reuse
# on exactly the requests where the body dwarfs the handshake, so the trade is
# not a real one. It is scoped to the body-carrying paths rather than set
# globally: ordinary small requests finish sending before any response arrives
# and never hit this, and they should keep the pool.
#
# WHAT THIS DOES NOT FIX — a known Apache-only difference.
#
# It repairs the case where the application answers BEFORE reading any of the
# body (401, CSRF rejection). It does NOT repair the case where the application
# reads part of the body and then refuses: an oversize upload is consumed to the
# 50 MB cap, answered 413, and the socket closed with the remainder still in
# flight. httpd sees the write fail and abandons the exchange without reading
# the response that is already waiting on the socket:
#
#   AH01084 (32)Broken pipe: pass request body failed to ... (app)
#   AH01097: pass request body failed
#
# The client gets a 502 where every other proxy here delivers the app's JSON
# 413. Five configurations were measured against the conformance suite and all
# five still produced the 502: proxy-nokeepalive alone, + proxy-sendcl,
# + proxy-sendchunked, `ProxyPass ... ping=5` (which makes mod_proxy_http use
# 100-continue, and does not help because the application answers 100 Continue
# and only refuses after reading to its cap), and LimitRequestBody lowered to the
# app's own cap (inert anyway, see below). There is no mod_proxy directive that
# says "on write failure, still read the response".
#
# So this is not fixable in Apache configuration. The fix belongs in the
# application — drain the remainder of the request body before returning 413,
# instead of closing on it. Until that lands, documentation MUST NOT claim the
# JSON-error contract holds on Apache; it holds on the other five cells.
<Location "/jmap/upload">
    SetEnv proxy-nokeepalive 1
</Location>
<Location "/api/import">
    SetEnv proxy-nokeepalive 1
</Location>

ProxyPreserveHost On
ProxyAddHeaders On
ProxyTimeout 300

# httpd.conf denies the filesystem root by default. Reverse-proxied requests are
# authorised through <Location>, not <Directory>, so grant it here explicitly
# rather than leaving it to depend on which default config you started from.
<Location "/">
    Require all granted
</Location>

<VirtualHost *:8080>
    ServerName mailwoman.local

    RequestHeader set X-Forwarded-Proto "http"
    RequestHeader set X-Forwarded-Port  "8080"

    # ---- WebSocket JMAP push (RFC 8887) ----
    # `upgrade=websocket` is what makes mod_proxy_wstunnel hand the connection
    # over. The tunnel timeout must outlast the server's 30 s heartbeat by a wide
    # margin; 3600 s matches the other cells.
    ProxyPass        /jmap/ws ws://app:8080/jmap/ws upgrade=websocket timeout=3600
    ProxyPassReverse /jmap/ws ws://app:8080/jmap/ws

    # ---- SSE: JMAP EventSource ----
    <Location "/jmap/eventsource">
        SetEnv no-gzip 1
        SetEnv dont-vary 1
    </Location>
    ProxyPass        /jmap/eventsource http://app:8080/jmap/eventsource timeout=3600
    ProxyPassReverse /jmap/eventsource http://app:8080/jmap/eventsource

    # ---- SSE: the assistant stream ----
    # A POST that returns text/event-stream. Nothing about the method or the path
    # marks it as a stream, so it needs its own entry.
    <Location "/api/assist/invoke">
        SetEnv no-gzip 1
        SetEnv dont-vary 1
    </Location>
    ProxyPass        /api/assist/invoke http://app:8080/api/assist/invoke timeout=3600
    ProxyPassReverse /api/assist/invoke http://app:8080/api/assist/invoke

    # ---- Large bodies ----
    ProxyPass        /jmap/upload http://app:8080/jmap/upload timeout=600
    ProxyPassReverse /jmap/upload http://app:8080/jmap/upload
    ProxyPass        /api/import  http://app:8080/api/import  timeout=600
    ProxyPassReverse /api/import  http://app:8080/api/import

    # ---- Everything else ----
    ProxyPass        / http://app:8080/
    ProxyPassReverse / http://app:8080/
</VirtualHost>

<VirtualHost *:8443>
    ServerName mailwoman.local

    SSLEngine on
    SSLCertificateFile    /certs/server.crt
    SSLCertificateKeyFile /certs/server.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # This is what tells the application it is being fronted with TLS, which in
    # turn drives the Secure cookie flag and the HSTS header. Getting it wrong is
    # how a TLS-terminated deployment ends up shipping session cookies without
    # Secure.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "8443"

    # HSTS is emitted by the application when the effective scheme is https. Do
    # not add a second one here.

    ProxyPass        /jmap/ws ws://app:8080/jmap/ws upgrade=websocket timeout=3600
    ProxyPassReverse /jmap/ws ws://app:8080/jmap/ws

    <Location "/jmap/eventsource">
        SetEnv no-gzip 1
        SetEnv dont-vary 1
    </Location>
    ProxyPass        /jmap/eventsource http://app:8080/jmap/eventsource timeout=3600
    ProxyPassReverse /jmap/eventsource http://app:8080/jmap/eventsource

    <Location "/api/assist/invoke">
        SetEnv no-gzip 1
        SetEnv dont-vary 1
    </Location>
    ProxyPass        /api/assist/invoke http://app:8080/api/assist/invoke timeout=3600
    ProxyPassReverse /api/assist/invoke http://app:8080/api/assist/invoke

    ProxyPass        /jmap/upload http://app:8080/jmap/upload timeout=600
    ProxyPassReverse /jmap/upload http://app:8080/jmap/upload
    ProxyPass        /api/import  http://app:8080/api/import  timeout=600
    ProxyPassReverse /api/import  http://app:8080/api/import

    ProxyPass        / http://app:8080/
    ProxyPassReverse / http://app:8080/
</VirtualHost>
