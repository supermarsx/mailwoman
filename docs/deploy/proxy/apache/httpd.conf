# Apache httpd main configuration for the Mailwoman conformance cell.
#
# CONTAINER-COMPLETE (mounted at /usr/local/apache2/conf/httpd.conf in the
# httpd:2.4-alpine image). If you already run httpd, you want `mailwoman.conf`
# instead — but check the LoadModule list below, because the three modules that
# matter (proxy_http, proxy_wstunnel, headers) are not all enabled by default in
# every distribution's httpd.
#
# SPEC §18.1 has named Apache as a supported front end for a long time while the
# repository shipped nothing for it. This is that file.

ServerRoot "/usr/local/apache2"
ServerName mailwoman.local
PidFile /usr/local/apache2/logs/httpd.pid

Listen 8080
Listen 8443

# ---------------------------------------------------------------------------
# Modules.
#
# proxy + proxy_http   the reverse proxy itself
# proxy_wstunnel       the /jmap/ws upgrade
# headers              stripping client-supplied forwarded headers
# ssl + socache_shmcb  the TLS vhost
# setenvif             per-location no-gzip
# mime, unixd, authz_core, log_config are httpd's own minimum to start.
#
# DELIBERATELY NOT LOADED: mod_deflate and mod_cache. Both will happily buffer
# a text/event-stream response and turn server-sent events into nothing at all.
# If your httpd loads them globally, the per-location `SetEnv no-gzip 1` in
# mailwoman.conf covers deflate; you must exclude the SSE paths from mod_cache
# yourself.
# ---------------------------------------------------------------------------
LoadModule mpm_event_module     modules/mod_mpm_event.so
LoadModule authz_core_module    modules/mod_authz_core.so
LoadModule log_config_module    modules/mod_log_config.so
LoadModule mime_module          modules/mod_mime.so
LoadModule unixd_module         modules/mod_unixd.so
LoadModule setenvif_module      modules/mod_setenvif.so
LoadModule headers_module       modules/mod_headers.so
LoadModule proxy_module         modules/mod_proxy.so
LoadModule proxy_http_module    modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
LoadModule ssl_module           modules/mod_ssl.so
LoadModule socache_shmcb_module modules/mod_socache_shmcb.so

User daemon
Group daemon

<Directory />
    AllowOverride none
    Require all denied
</Directory>

TypesConfig conf/mime.types

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b xff=\"%{X-Forwarded-For}i\"" mailwoman
CustomLog /proc/self/fd/1 mailwoman

# NEVER a forward proxy. Leaving this On turns the box into an open relay for
# arbitrary outbound HTTP.
ProxyRequests Off

Include conf/extra/mailwoman.conf
