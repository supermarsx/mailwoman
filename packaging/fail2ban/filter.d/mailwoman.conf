[Definition]
# Accept the exact Mailwoman record, optionally with its standard tracing prefix.
# Never accept an arbitrary prefix containing attacker-controlled text.
failregex = ^\s*(?:\d{4}-\d{2}-\d{2}T[0-9:.+-]+Z?\s+)?(?:WARN\s+mw_server::(?:admin_accounts|security_center):\s+)?(?:\d{4}-\d{2}-\d{2}T[0-9:.+-]+Z?\s+)?mailwoman\[auth\]: authentication failure; logname=[A-Za-z0-9@._+-]{1,128} rhost=<ADDR>\s*$
ignoreregex =
