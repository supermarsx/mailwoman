# Without the mailbox extensions: no QUOTA, STATUS=SIZE, LIST-STATUS,
# SPECIAL-USE, NAMESPACE or LIST-EXTENDED. The imap_quota plugin adds QUOTA
# on its own, so it is switched off here instead of listed.
imap_capability {
  "STATUS=SIZE" = no
  LIST-STATUS = no
  SPECIAL-USE = no
  NAMESPACE = no
  LIST-EXTENDED = no
}
protocol imap {
  mail_plugins {
    imap_quota = no
  }
}
