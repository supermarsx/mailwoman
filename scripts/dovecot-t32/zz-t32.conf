# Mailwoman t32 IMAP extension interop target (Dovecot 2.4). CI/DEV ONLY.
#
# The stock dovecot/dovecot:2.4.4 image already advertises most modern
# extensions (IMAP4rev2, CONDSTORE/QRESYNC, ESEARCH, NOTIFY, COMPRESS=DEFLATE,
# UTF8=ACCEPT, STATUS=SIZE, PREVIEW, SAVEDATE, BINARY, MULTIAPPEND, CATENATE,
# REPLACE, INPROGRESS, LITERAL+, SASL-IR). This file adds the account, a
# plaintext listener and QUOTA. Each file in variants/ is mounted next to it
# and removes one group of extensions from the advertised capability list, so
# every extension test runs once with the capability and once without it.
#
# Removing a capability only hides it: Dovecot still accepts the commands. That
# is enough, because the client decides from the advertised list alone.
#
# Included via the stock image's `!include_try conf.d/*.conf`.

protocols = imap

# Plaintext sign-in on 143 only: a local test target, never exposed.
auth_allow_cleartext = yes
ssl = no
auth_mechanisms = plain

passdb passwd-file {
  passwd_file_path = /etc/dovecot/mailwoman-users
}
userdb passwd-file {
  passwd_file_path = /etc/dovecot/mailwoman-users
}

# QUOTA (RFC 9208): a 10 MiB storage limit, so GETQUOTAROOT returns numbers.
mail_plugins {
  quota = yes
}
quota "User quota" {
  storage_size = 10M
}
protocol imap {
  mail_plugins {
    imap_quota = yes
  }
}

service imap-login {
  inet_listener imap {
    port = 143
  }
}
