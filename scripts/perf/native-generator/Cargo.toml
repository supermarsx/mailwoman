# Native load generator (t62-n10). Its own Cargo workspace and lockfile: it is
# not a member of the server workspace, adds nothing to the server Cargo.lock,
# and is not part of any release or fixture image build.
[workspace]

[package]
name = "mw-loadgen"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
description = "Native counterpart of the scripts/perf Node load generator (fixture campaigns only)"

[[bin]]
name = "mw-loadgen"
path = "src/main.rs"

[dependencies]
bytes = "1"
flate2 = "1"
h2 = "0.4"
http = "1"
httparse = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation"] }

[profile.release]
debug = "line-tables-only"
codegen-units = 4
lto = "thin"
panic = "abort"
