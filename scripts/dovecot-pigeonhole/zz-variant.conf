# Variant drop-in for the ManageSieve live tests (t32 f18), mounted next to
# zz-pigeonhole.conf as conf.d/zz-variant.conf: a small script quota, a small
# script-size limit, SCRAM-SHA-256 offered, and `vacation` switched off so the
# client sees an unadvertised extension. CI/DEV ONLY.

sieve_quota_script_count = 2
sieve_quota_storage_size = 4k
sieve_max_script_size = 2k

auth_mechanisms = plain scram-sha-256

sieve_extensions {
  vacation = no
}
